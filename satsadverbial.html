<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satsadverbialets plats – dra och släpp</title>
<script>
  // Sätt tema innan sidan ritas (ingen blinkning)
  (function(){var t=null;try{t=localStorage.getItem("sa-theme")}catch(e){}
    if(!t) t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
    document.documentElement.dataset.theme=t;})();
</script>
<style>
:root{
  --bg:#f5f3ee;--card:#ffffff;--ink:#1d2733;--muted:#6b7480;--line:#e4dfd4;
  --chip:#f2f4f7;--chip-b:#dfe4ea;--chip-shadow:0 1px 0 rgba(20,30,40,.06);
  --accent:#2c5a86;--accent-d:#224a70;--accent-text:#2c5a86;--adv:#2c6bb0;--adv-d:#1f5288;
  --ok:#1e9a56;--ok-d:#157a42;--ok-bg:#e8f6ee;--err:#d24545;--err-d:#a83434;--err-bg:#fdeeee;
  --sub:#fff1c9;--sub-b:#e2ac2f;--hot:#f0f5fa;--hot-b:#d3e0ec;
  --card-shadow:0 1px 2px rgba(20,30,40,.05),0 10px 34px rgba(20,30,40,.08);
  --btn2:#eceae4;--btn2-h:#e2dfd6;
}
[data-theme="dark"]{
  --bg:#12161b;--card:#1b2129;--ink:#e6eaf0;--muted:#97a1ad;--line:#2d3641;
  --chip:#252d37;--chip-b:#36404c;--chip-shadow:0 1px 0 rgba(0,0,0,.3);
  --accent:#6aa5dc;--accent-d:#4f8cc6;--accent-text:#8cbcea;--adv:#3577bb;--adv-d:#255a91;
  --ok:#3cc483;--ok-d:#27935f;--ok-bg:#163126;--err:#f06d6d;--err-d:#b84848;--err-bg:#3a2023;
  --sub:#3b321d;--sub-b:#d1a03a;--hot:#1f2833;--hot-b:#334457;
  --card-shadow:0 1px 2px rgba(0,0,0,.4),0 12px 36px rgba(0,0,0,.35);
  --btn2:#2a323c;--btn2-h:#333d48;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
header,main{width:100%;max-width:1420px;padding-left:24px;padding-right:24px}
header{padding-top:28px}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);font-weight:600}
h1{margin:6px 0 0;font-size:1.75rem;font-weight:650;letter-spacing:-.015em}
.instr{margin:10px 0 0;font-size:1.06rem;line-height:1.5;opacity:.85;max-width:720px}
.theme-btn{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:99px;padding:8px 14px;font-size:.9rem;font-weight:600;box-shadow:var(--chip-shadow);white-space:nowrap}
.theme-btn:hover{border-color:var(--chip-b)}
.theme-btn{justify-content:center;width:var(--tbw,auto)}
.head-tools{display:flex;gap:10px;align-items:center}
.lang{position:relative;display:flex;align-items:center}
.lang svg{position:absolute;left:12px;width:17px;height:17px;pointer-events:none;color:var(--ink)}
.lang select{appearance:none;-webkit-appearance:none;font:inherit;font-size:.9rem;font-weight:600;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:99px;padding:8px 34px 8px 36px;cursor:pointer;box-shadow:var(--chip-shadow);
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 52%,calc(100% - 12px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.lang select:hover{border-color:var(--chip-b)}
.lang select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme-btn svg{width:18px;height:18px}
.top{display:flex;align-items:center;gap:18px;margin-top:22px}
.progress{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.stats{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem;white-space:nowrap}
.stats b{color:var(--ink);font-weight:600}
main{padding-top:18px;padding-bottom:40px}

.card{background:var(--card);border-radius:20px;position:relative;box-shadow:var(--card-shadow);padding:52px 34px 10px;transition:background .3s}
.num{position:absolute;top:20px;left:28px;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.badge{position:absolute;top:16px;right:20px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:1.6rem;font-weight:800;transform:scale(0);opacity:0}
.badge.ok{background:var(--ok);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards}
.badge.bad{background:var(--err);animation:pop .45s cubic-bezier(.2,1.6,.4,1) forwards, shake .4s .35s}
.badge svg{width:26px;height:26px}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-5px) scale(1)}75%{transform:translateX(5px) scale(1)}}

/* --- Meningen --- */
.sentence{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-start;column-gap:clamp(6px,.75vw,10px);row-gap:14px;min-height:96px;
  padding:62px 18px 84px var(--padl,18px);border-radius:16px;border:2px dashed transparent;transition:background .2s,border-color .2s;position:relative}
.sentence.hot{background:var(--hot);border-color:var(--hot-b)}
.adv.home{margin-left:22px}
.word,.adv,.ghost{font-size:clamp(15px,1.9vw - 4px,1.4rem);line-height:1;padding:.45em .62em;border-radius:10px;white-space:nowrap;border:2px solid transparent;
  user-select:none;-webkit-user-select:none}
.word{background:var(--chip);border-color:var(--chip-b);box-shadow:var(--chip-shadow);transition:background .3s,border-color .3s,color .3s}
.word.sub{background:var(--sub);border-color:var(--sub-b)}
.word.fv{color:var(--ok);font-weight:700}
/* --- Satsadverbialet: lätt upphöjd bricka --- */
.adv{--c-hi:#3a7bc2;--c:#2c6bb0;--c-d:#1f5288;
  position:relative;color:#fff;font-weight:600;cursor:grab;touch-action:none;outline:none;
  border:1px solid var(--c-d);
  background:linear-gradient(180deg,var(--c-hi),var(--c));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 0 var(--c-d),0 4px 10px rgba(15,40,80,.18);
  transition:translate .15s ease,box-shadow .15s ease,background .25s,border-color .25s}
[data-theme="dark"] .adv{--c-hi:#3f84ca;--c:#3577bb;--c-d:#245a92}
.adv:not(.placed):not(.ph):hover{translate:0 -1px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 var(--c-d),0 7px 14px rgba(15,40,80,.22)}
.adv:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.adv.ph{background:transparent;color:transparent;border:2px dashed var(--accent);box-shadow:none;translate:0 0}
.adv.placed{cursor:default}
.adv.ok{--c-hi:#27a862;--c:#1f9d58;--c-d:#157a42}
.adv.bad{--c-hi:#dc5353;--c:#d24545;--c-d:#a83434}
.floating{position:fixed;z-index:1000;margin:0;pointer-events:none;cursor:grabbing;
  transform:scale(1.05) rotate(-1.5deg);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 0 var(--c-d),0 12px 26px rgba(15,40,80,.28)}
.ghost{position:relative;border:2px dashed var(--ok);color:var(--ok);background:var(--ok-bg);font-weight:600}
.ghost::after{content:attr(data-label);position:absolute;left:50%;top:-21px;transform:translateX(-50%);font-size:.66rem;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ok);font-weight:700;white-space:nowrap}
body.dragging,body.dragging *{cursor:grabbing!important}

/* --- Feedback --- */
.next-row{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:18px;min-height:46px;opacity:0;transform:translateY(6px);pointer-events:none;transition:opacity .3s,transform .3s}
.next-row.show{opacity:1;transform:none;pointer-events:auto}
.why{background:transparent;color:var(--accent-text);border:1.5px solid var(--line);margin-right:auto}
.why:hover{background:var(--btn2)}
/* --- Modal --- */
.modal{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(15,20,28,.45);opacity:0;pointer-events:none;transition:opacity .22s}
[data-theme="dark"] .modal{background:rgba(0,0,0,.6)}
.modal.open{opacity:1;pointer-events:auto}
.modal-box{position:relative;background:var(--card);color:var(--ink);border-radius:18px;max-width:620px;width:100%;
  padding:40px 36px 32px;box-shadow:0 24px 60px rgba(0,0,0,.3);transform:translateY(14px) scale(.97);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal.open .modal-box{transform:none}
.modal-box p{margin:0;font-size:1.12rem;line-height:1.6}
.modal-box .ex{display:block;margin-top:16px;padding:14px 18px;border-radius:12px;background:var(--chip);border:1px solid var(--chip-b);font-size:1.15rem}
.modal-box .ex b{color:var(--ok)}
.close-x{position:absolute;top:12px;right:12px;width:38px;height:38px;padding:0;border-radius:9px;background:transparent;
  color:#4b5563;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .25s ease}
.close-x svg{width:20px;height:20px}
.close-x:hover{background:#e5e7eb;color:#dc2626;transform:rotate(90deg)}
[data-theme="dark"] .close-x{color:#9aa3ae}
[data-theme="dark"] .close-x:hover{background:#343d48;color:#f06d6d}
/* --- Anteckningar efter svar: verb-pil och bisats-klammer --- */
.annot{position:absolute;pointer-events:none;color:var(--sub-b);font-weight:700;text-align:center;white-space:nowrap}
.annot.verb{font-size:1.15rem;line-height:1;display:flex;flex-direction:column;align-items:center;gap:2px;transform:translateX(-50%)}
.annot.verb svg{width:18px;height:22px}
.annot.bracket{overflow:visible}
.annot.bracket path{fill:none;stroke:var(--sub-b);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.annot.label{font-size:1.3rem;transform:translateX(-50%)}
.feedback{margin-top:22px;border-radius:14px;padding:0 20px;max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s ease,opacity .3s ease,padding .3s ease}
.feedback.show{max-height:340px;opacity:1;padding:18px 20px}
.feedback.ok{background:var(--ok-bg)}
.feedback.bad{background:var(--err-bg)}
.fb-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.fb-title{font-weight:700;font-size:1.08rem}
.feedback.ok .fb-title{color:var(--ok)}
.feedback.bad .fb-title{color:var(--err)}
.fb-type{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fb-sentence{margin:10px 0 6px;font-size:1.12rem}
.fb-sentence strong{color:var(--ok)}
.fb-expl{line-height:1.5;opacity:.9}
.fb-expl em{font-style:normal;font-weight:700;color:var(--accent-text)}
.swatch{display:inline-block;width:.9em;height:.9em;border-radius:3px;background:var(--sub);border:2px solid var(--sub-b);vertical-align:-1px}
.actions{display:flex;justify-content:flex-end;margin-top:14px}
button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 20px;font-weight:600;font-size:1rem;transition:background .2s,transform .1s}
button:active{transform:translateY(1px)}
.primary{background:var(--adv);color:#fff}
.primary:hover{background:var(--adv-d)}
.secondary{background:var(--btn2);color:var(--ink)}
.secondary:hover{background:var(--btn2-h)}

details{margin-top:18px;font-size:.97rem}
summary{cursor:pointer;color:var(--accent-text);font-weight:600}
.rule{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule div{background:var(--card);border-radius:12px;padding:14px 16px;border:1px solid var(--line);line-height:1.5}
.rule b{display:block;margin-bottom:4px}
.rule .ex{color:var(--muted)}
.rule .ex span{color:var(--accent-text);font-weight:700}
.kbd{font-size:.85rem;color:var(--muted);margin-top:14px}

.end{text-align:center;padding:20px 10px 10px}
.end .big{font-size:3.4rem;font-weight:700;letter-spacing:-.02em;margin:10px 0 2px}
.end p{color:var(--muted);margin:4px 0 22px;font-size:1.05rem}
.end .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.hidden{display:none!important}

@media (max-width:720px){
  .card{padding:50px 16px 22px}
  .sentence{padding:58px 8px 80px var(--padl,8px);column-gap:7px}
  .rule{grid-template-columns:1fr}
  .theme-btn span{display:none}
  .theme-btn{width:auto}
  .head-row{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div>
      <div class="eyebrow" data-i18n="eyebrow"></div>
      <h1 data-i18n="title"></h1>
    </div>
    <div class="head-tools">
      <label class="lang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9s1.3-6.3 3.8-9z"/></svg>
        <select id="langSel" aria-label="Språk / Language">
          <option value="sv">Svenska</option><option value="en">English (UK)</option><option value="de">Deutsch</option><option value="nl">Nederlands</option>
        </select></label>
      <button class="theme-btn" id="themeBtn" type="button"></button>
    </div>
  </div>
  <p class="instr" data-i18n="instr"></p>
  <div class="top">
    <div class="progress"><div id="bar"></div></div>
    <div class="stats" id="stats"></div>
  </div>
</header>

<main>
  <section class="card" id="quiz">
    <div class="num" id="num"></div>
    <div class="badge" id="badge"></div>
    <div class="sentence" id="sentence"></div>
  </section>
  <div class="next-row" id="nextRow"><button class="why hidden" id="why" data-i18n="why"></button><button class="primary" id="next">Nästa mening →</button></div>
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalText">
      <button class="close-x" id="closeX" data-i18n-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <p id="modalText"></p>
    </div>
  </div>

  <section class="card hidden" id="end">
    <div class="end">
      <div class="eyebrow" data-i18n="done"></div>
      <div class="big" id="endScore"></div>
      <p id="endMsg"></p>
      <div class="btns">
        <button class="secondary" id="retryWrong" data-i18n="retry"></button>
        <button class="primary" id="restart" data-i18n="restart"></button>
      </div>
    </div>
  </section>

</main>

<script>
// k: H = bara huvudsats, BH = bisats + huvudsats, HB = huvudsats + bisats
// g = rätt position (antal ord före satsadverbialet; lista = flera godtas, första är huvudsvaret),
// s = var bisatsen börjar (HB), e = bisatsens sista ord (BH)
const DATA = [
  {"t": "Jag har spelat tennis.", "a": "aldrig", "g": 2, "k": "H"},
  {"t": "Hon dricker kaffe på morgonen.", "a": "ofta", "g": 2, "k": "H"},
  {"t": "Vi åker till Göteborg i helgen.", "a": "förmodligen", "g": 2, "k": "H"},
  {"t": "Barnen vill gå och lägga sig.", "a": "inte", "g": 2, "k": "H"},
  {"t": "Min bror cyklar till jobbet.", "a": "alltid", "g": 3, "k": "H"},

  {"t": "Tåget är försenat.", "a": "sannolikt", "g": 2, "k": "H"},

  {"t": "Lärarens röst låter trött.", "a": "alltid", "g": 3, "k": "H"},
  {"t": "Vi hinner till bussen.", "a": "nog", "g": 2, "k": "H"},
  {"t": "Paketet kommer fram på måndag.", "a": "sannolikt", "g": 2, "k": "H"},
  {"t": "Hon har läst den boken.", "a": "redan", "g": 2, "k": "H"},
  {"t": "Mormor bakar kanelbullar på söndagar.", "a": "alltid", "g": 2, "k": "H"},
  {"t": "Det här är ett bra förslag.", "a": "verkligen", "g": 3, "k": "H"},
  {"t": "Jag förstår frågan.", "a": "inte", "g": 2, "k": "H"},
  {"t": "Familjen tittar på tv på kvällarna.", "a": "sällan", "g": 2, "k": "H"},
  {"t": "Jag hittar mina glasögon.", "a": "inte", "k": "H", "g": 2},
  {"t": "Siri har betalat hyran.", "a": "redan", "k": "H", "g": 2},
  {"t": "Vi brukar äta ute.", "a": "sällan", "k": "H", "g": 2},
  {"t": "Hissen fungerar igen.", "a": "äntligen", "k": "H", "g": 2},
  {"t": "Amir köper blommor på fredagar.", "a": "ofta", "k": "H", "g": 2},

  {"t": "Vår hund skäller på brevbäraren.", "a": "alltid", "k": "H", "g": 3},
  {"t": "Jag har smakat ostron.", "a": "aldrig", "k": "H", "g": 2},

  {"t": "Badhuset öppnar i morgon.", "a": "förmodligen", "k": "H", "g": 2},

  {"t": "Eftersom jag jobbar sent lagar min sambo maten.", "a": "ofta", "g": 2, "k": "BH", "e": 3},
  {"t": "Om det regnar i morgon går vi till stranden.", "a": "inte", "g": 2, "k": "BH", "e": 4},

  {"t": "Eftersom jag hittar nyckeln tar jag reservnyckeln.", "a": "inte", "g": 2, "k": "BH", "e": 3},
  {"t": "Trots att Filip tränar springer han fort.", "a": "sällan", "g": 3, "k": "BH", "e": 3},

function tokenize(t){ return t.split(" "); }
const isPunct=w=>/^[.!?]$/.test(w);
const goals=it=>Array.isArray(it.g)?it.g:[it.g];
function joinToks(a){ return a.reduce((s,w)=>s+(s&&!isPunct(w.replace(/<[^>]+>/g,""))?" ":"")+w,""); }
function subRange(it,toks){
  const last=isPunct(toks[toks.length-1])?toks.length-2:toks.length-1;
  if(it.k==="BH") return [0,it.e];
  if(it.k==="HB") return [it.s,last];
  return null;
}

/* ---------- FLIP: orden glider till sina nya platser ---------- */
function flip(mutate){
  const els=[...sentenceEl.children];
  const before=new Map(els.map(e=>[e,e.getBoundingClientRect()]));
  els.forEach(e=>e.getAnimations().forEach(a=>{ if(a instanceof CSSAnimation) return; a.cancel(); }));
  mutate();
  const now=[...sentenceEl.children];
  const after=new Map(now.map(e=>[e,e.getBoundingClientRect()]));
  cacheLayout(after);
  now.forEach(e=>{
    const b=before.get(e), a=after.get(e); if(!b) return;
    const dx=b.left-a.left, dy=b.top-a.top;
    if(Math.abs(dx)<.5&&Math.abs(dy)<.5) return;
    e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:"translate(0,0)"}],{duration:230,easing:EASE});
  });
}

function cacheLayout(rects){
  const cr=sentenceEl.getBoundingClientRect();
  const rel=r=>({l:r.left-cr.left,r:r.right-cr.left,t:r.top-cr.top,b:r.bottom-cr.top});
  const get=e=>rel(rects&&rects.get(e)||e.getBoundingClientRect());
  layout={w:cr.width,h:cr.height,words:cur.words.map(get),adv:get(cur.adv)};
}

function pos(){ // antal ord före satsadverbialet
  let n=0; for(const c of sentenceEl.children){ if(c===cur.adv) return n; if(c.classList.contains("word")) n++; } return n;
}
function moveTo(i){
  const n=cur.words.length;
  i=Math.max(0,Math.min(n,i));
  if(i===pos()) return;
  flip(()=>{
    if(i>=n) sentenceEl.append(cur.adv); else sentenceEl.insertBefore(cur.adv,cur.words[i]);
    cur.adv.classList.toggle("home",i>=n);
    sentenceEl.classList.toggle("homing",i>=n);
  });
}

/* Var ska satsadverbialet in? Utgår från brickans framkant i rörelseriktningen:
   ett ord viker undan så fort brickan täcker ungefär en fjärdedel av det. */
const OVERLAP=.25;
function targetFor(c,dir){   // c = brickans rektangel relativt meningen
  const n=cur.words.length, L=layout, cx=(c.l+c.r)/2, cy=(c.t+c.b)/2;
  if(cx<-60||cx>L.w+60||cy<-70||cy>L.h+70) return n;       // utanför: tillbaka hem
  const W=L.words.map((r,i)=>({r,i}));
  let row=W.filter(o=>cy>=o.r.t-10&&cy<=o.r.b+10);
  if(!row.length){
    let best=W[0],bd=Infinity; W.forEach(o=>{const d=Math.abs(cy-(o.r.t+o.r.b)/2); if(d<bd){bd=d;best=o;}});
    row=W.filter(o=>Math.abs(o.r.t-best.r.t)<4);
  }
  const p=pos(), A=L.adv;
  const sameRow = !cur.adv.classList.contains("home") && cy>=A.t-10 && cy<=A.b+10;
  if(!sameRow){                                             // ny rad / in från hemplatsen
    if(cur.adv.classList.contains("home") && dir<=0){
      const cand=row.filter(o=>c.l < o.r.r - OVERLAP*(o.r.r-o.r.l));
      if(cand.length) return cand[0].i;
      return null;
    }
    for(const o of row) if(cx<(o.r.l+o.r.r)/2) return o.i;
    return row[row.length-1].i+1;
  }
  if(dir<0){ // vänster: första ordet till vänster som brickans vänsterkant har gått in i
    const cand=row.filter(o=>o.i<p && c.l < o.r.r - OVERLAP*(o.r.r-o.r.l));
    return cand.length?cand[0].i:null;
  }
  if(dir>0){ // höger: sista ordet till höger som brickans högerkant har gått in i
    const cand=row.filter(o=>o.i>=p && c.r > o.r.l + OVERLAP*(o.r.r-o.r.l));
    return cand.length?cand[cand.length-1].i+1:null;
  }
  return null;
}

const cardEl=document.getElementById("quiz");
function killFloats(){ document.querySelectorAll(".floating").forEach(f=>f.remove()); }

function onDown(e){
  if(cur.done||cur.busy||e.button>0) return;
  if(drag) return;                 // redan en dragning igång – starta aldrig en till
  e.preventDefault();
  killFloats();
  const adv=cur.adv, r=adv.getBoundingClientRect();
  const fl=document.createElement("span");
  fl.className="adv floating"; fl.textContent=adv.textContent;
  fl.style.left=r.left+"px"; fl.style.top=r.top+"px"; fl.style.width=r.width+"px";
  document.body.append(fl);
  adv.classList.remove("idle"); adv.classList.add("ph");
  document.body.classList.add("dragging");
  drag={fl,dx:e.clientX-r.left,dy:e.clientY-r.top,w:r.width,h:r.height,id:e.pointerId,lastX:e.clientX,dir:0};
  cacheLayout();
  // Fånga pekaren på kortet (som aldrig flyttas): då kommer släppet fram
  // även om musen släpps utanför fönstret/ramen.
  try{ cardEl.setPointerCapture(e.pointerId); }catch(_){}
  cardEl.addEventListener("pointermove",onMove);
  cardEl.addEventListener("pointerup",onUp);
  cardEl.addEventListener("pointercancel",onUp);
  cardEl.addEventListener("lostpointercapture",onUp);
  window.addEventListener("blur",onUp);
}
function onMove(e){
  if(!drag||e.pointerId!==drag.id) return;
  drag.fl.style.left=(e.clientX-drag.dx)+"px";
  drag.fl.style.top=(e.clientY-drag.dy)+"px";
  const cr=sentenceEl.getBoundingClientRect();
  const l=e.clientX-drag.dx-cr.left, t0=e.clientY-drag.dy-cr.top;
  const c={l,r:l+drag.w,t:t0,b:t0+drag.h};
  const dx=e.clientX-drag.lastX;
  if(Math.abs(dx)>=1){ drag.dir=Math.sign(dx); drag.lastX=e.clientX; }
  const cx=(c.l+c.r)/2, cy=(c.t+c.b)/2;
  sentenceEl.classList.toggle("hot", !(cx<-60||cx>cr.width+60||cy<-70||cy>cr.height+70));
  const t=targetFor(c,drag.dir);
  if(t!==null) moveTo(t);
}
function onUp(e){
  if(!drag) return;
  if(e && e.pointerId!==undefined && e.pointerId!==drag.id) return;
  cardEl.removeEventListener("pointermove",onMove);
  cardEl.removeEventListener("pointerup",onUp);
  cardEl.removeEventListener("pointercancel",onUp);
  cardEl.removeEventListener("lostpointercapture",onUp);
  window.removeEventListener("blur",onUp);
  try{ cardEl.releasePointerCapture(drag.id); }catch(_){}
  const {fl}=drag; drag=null; cur.busy=true;
  sentenceEl.classList.remove("hot");
  document.body.classList.remove("dragging");
  const cr=sentenceEl.getBoundingClientRect();
  const fr=fl.getBoundingClientRect();
  const tx=cr.left+layout.adv.l, ty=cr.top+layout.adv.t;
  const anim=fl.animate([
    {transform:"translate(0,0) scale(1.05) rotate(-1.5deg)"},
    {transform:`translate(${tx-parseFloat(fl.style.left)}px,${ty-parseFloat(fl.style.top)}px) scale(1) rotate(0deg)`}
  ],{duration:200,easing:EASE,fill:"forwards"});
  let landed=false;
  const land=()=>{
    if(landed) return; landed=true;
    killFloats(); cur.adv.classList.remove("ph"); cur.busy=false;
    const i=pos();
    if(i<cur.words.length) evaluate(i); else cur.adv.classList.add("idle");
  };
  anim.onfinish=land; anim.oncancel=land;
  setTimeout(land,350);   // reserv: landa även om animationen avbryts
}

/* ---------- Tangentbord ---------- */
function onKey(e){
  if(cur.done||cur.busy) return;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault(); cur.adv.classList.remove("idle");
    let p=pos();
    if(p===cur.words.length && e.key==="ArrowLeft") p=cur.words.length; // från hem: börja sist i meningen
    moveTo(p+(e.key==="ArrowRight"?1:-1));
  } else if(e.key==="Enter"||e.key===" "){
    e.preventDefault(); e.stopPropagation();
    if(pos()<cur.words.length) evaluate(pos());
  } else if(e.key==="Escape"){ moveTo(cur.words.length); }
}
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&cur&&cur.done&&!$("modal").classList.contains("open")&&!$("quiz").classList.contains("hidden")&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();next();}
});

/* ---------- Bedömning ---------- */
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function evaluate(i){
  const {it,toks}=cur; cur.done=true;
  const G=goals(it), g0=G[0];
  const ok=G.includes(i);
  if(ok) score++; else wrong.push(it);
  const adv=cur.adv;
  adv.classList.remove("idle","home"); sentenceEl.classList.remove("homing"); adv.classList.add("placed",ok?"ok":"bad");
  adv.removeAttribute("tabindex"); adv.blur();

  const range=subRange(it,toks);
  if(range) for(let k=range[0];k<=range[1];k++) cur.words[k].classList.add("sub");
  const fvIdx = it.f!==undefined ? it.f : (it.k==="H"?g0-1:g0);
  cur.words[fvIdx].classList.add("fv");

  if(!ok){
    const gh=document.createElement("span"); gh.className="ghost"; gh.textContent=it.a; gh.dataset.label=T("right");
    flip(()=>sentenceEl.insertBefore(gh,cur.words[g0]));
    gh.animate([{opacity:0,transform:"scale(.85)"},{opacity:1,transform:"scale(1)"}],{duration:300,delay:120,easing:EASE,fill:"backwards"});
  }

  badge.className="badge "+(ok?"ok":"bad");
  badge.innerHTML=ok?CHECK:"!";

  cur.range=range; cur.fvIdx=fvIdx;
  setTimeout(()=>drawAnnotations(true), ok?120:300);
  setNextLabel();
  updateTop();
  $("why").classList.toggle("hidden", ok);
  $("nextRow").classList.add("show");
  setTimeout(()=>$("next").focus({preventScroll:true}),60);
}

/* ---------- Förklaringsmodal ---------- */
const WHY_EX={
  H:'<span class="ex">"Jag har <b>INTE</b> tid att träffa dig idag."</span>',
  B:'<span class="ex">"Om du <b>INTE</b> har tid, kan vi ses en annan dag."</span>'
};
function fillModal(){ const k=cur.it.k==="H"?"H":"B"; $("modalText").innerHTML=T("why"+k)+WHY_EX[k]; }
function setNextLabel(){ $("next").textContent=T(idx===order.length-1?"results":"next"); }
function openModal(){
  fillModal();
  $("modal").classList.add("open"); $("modal").setAttribute("aria-hidden","false");
  setTimeout(()=>$("closeX").focus({preventScroll:true}),50);
}
function closeModal(){
  if(!$("modal").classList.contains("open")) return;
  $("modal").classList.remove("open"); $("modal").setAttribute("aria-hidden","true");
  $("why").focus({preventScroll:true});
}
$("why").addEventListener("click",openModal);
$("closeX").addEventListener("click",closeModal);
$("modal").addEventListener("click",e=>{ if(e.target===$("modal")) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); },true);

/* Klammer under bisatsen med ordet "Bisats", och "verb" med pil över det finita verbet */
const ARROW='<svg viewBox="0 0 18 22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v17M3 13l6 6 6-6"/></svg>';
function drawAnnotations(animate){
  if(!cur||!cur.done) return;
  sentenceEl.querySelectorAll(".annot").forEach(e=>e.remove());
  const cr=sentenceEl.getBoundingClientRect(), bx=cr.left+sentenceEl.clientLeft, by=cr.top+sentenceEl.clientTop;
  const R=el=>{const r=el.getBoundingClientRect();return {l:r.left-bx,r:r.right-bx,t:r.top-by,b:r.bottom-by};};
  // verb
  const v=R(cur.words[cur.fvIdx]);
  const verb=document.createElement("div"); verb.className="annot verb";
  verb.innerHTML="<span>"+T("verb")+"</span>"+ARROW;
  verb.style.left=((v.l+v.r)/2)+"px"; sentenceEl.append(verb);
  verb.style.top=(v.t-verb.offsetHeight-14)+"px";
  if(animate){
    verb.animate([{opacity:0,transform:"translate(-50%,-14px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:420,easing:EASE,fill:"backwards"});
    verb.querySelector("svg").animate([{transform:"translateY(0)"},{transform:"translateY(4px)"},{transform:"translateY(0)"}],{duration:500,delay:420,easing:"ease-in-out"});
  }
  // bisats
  if(cur.range){
    const a=R(cur.words[cur.range[0]]), z=R(cur.words[cur.range[1]]);
    const x0=a.l-6, x1=z.r+6, y=Math.max(a.b,z.b)+10, w=x1-x0, h=14;
    const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("class","annot bracket"); svg.setAttribute("width",w); svg.setAttribute("height",h);
    svg.style.left=x0+"px"; svg.style.top=y+"px";
    svg.innerHTML=`<path pathLength="1" d="M1.5 1.5 V${h-2} H${w-1.5} V1.5"/>`;
    sentenceEl.append(svg);
    const lab=document.createElement("div"); lab.className="annot label"; lab.textContent=T("sub");
    lab.style.left=(x0+w/2)+"px"; lab.style.top=(y+h+8)+"px"; sentenceEl.append(lab);
    if(animate){
      const path=svg.querySelector("path");
      path.style.strokeDasharray="1"; 
      path.animate([{strokeDashoffset:1},{strokeDashoffset:0}],{duration:550,delay:150,easing:"cubic-bezier(.4,0,.2,1)",fill:"backwards"});
      lab.animate([{opacity:0,transform:"translate(-50%,8px)"},{opacity:1,transform:"translate(-50%,0)"}],{duration:380,delay:550,easing:EASE,fill:"backwards"});
    }
  }
}
window.addEventListener("resize",()=>drawAnnotations(false));

function next(){ if(idx<order.length-1){idx++;show();} else finish(); }

function fillEnd(){
  const pct=Math.round(score/order.length*100);
  $("endScore").textContent=score+" / "+order.length;
  $("endMsg").textContent=T(pct===100?"m100":pct>=80?"m80":pct>=50?"m50":"m0",{p:pct});
}
function finish(){
  $("quiz").classList.add("hidden"); $("end").classList.remove("hidden");
  $("nextRow").classList.remove("show");
  fillEnd();
  $("retryWrong").classList.toggle("hidden",wrong.length===0);
  $("bar").style.width="100%";
}

$("next").addEventListener("click",next);
$("restart").addEventListener("click",()=>start(DATA));
$("retryWrong").addEventListener("click",()=>start(wrong));

start(DATA);
</script>
