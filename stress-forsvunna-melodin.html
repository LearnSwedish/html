<title>Den försvunna melodin</title>
<style>

* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:Georgia,"Times New Roman",serif; }
.shell { max-width:810px; margin:0 auto; padding:clamp(40px,8vw,95px) clamp(22px,5vw,65px) 110px; }
h1 { font-size:clamp(2.3rem,6vw,3.75rem); font-weight:400; letter-spacing:-.035em; line-height:1.15; margin:0 0 1.2em; }
.story { font-size:clamp(1.13rem,1.65vw,1.31rem); line-height:1.94; }
.story p { margin:0; }
.story p+p { margin-top:1.32em; }
/* Avsiktligt omöjligt att skilja interaktiva ord från vanlig text. */
.word,.word:hover,.word:active { display:inline; appearance:none; -webkit-appearance:none; border:0; border-radius:0; margin:0; padding:0; background:none; box-shadow:none; outline:none; color:inherit; font:inherit; font-weight:inherit; letter-spacing:inherit; word-spacing:inherit; line-height:inherit; text-align:inherit; text-decoration:none; text-shadow:none; vertical-align:baseline; cursor:text; }
.word:focus-visible { outline:1px solid var(--focus); outline-offset:2px; }
[hidden] { display:none!important; }
.modal-backdrop { position:fixed; inset:0; z-index:10; background:#172024b8; display:grid; place-items:center; padding:20px; backdrop-filter:blur(3px); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
.modal { background:var(--paper); width:min(100%,540px); border-radius:16px; padding:clamp(22px,5vw,38px); box-shadow:0 30px 90px #0005; max-height:calc(100dvh - 40px); overflow:auto; }
.modal-top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; }
.modal-kicker { font-size:.75rem; text-transform:uppercase; color:var(--accent); font-weight:750; letter-spacing:.12em; }
h2 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(2rem,6vw,2.7rem); font-weight:500; margin:6px 0 0; overflow-wrap:anywhere; }
.icon-button { display:grid; place-items:center; border:1px solid var(--border); border-radius:999px; background:white; color:var(--ink); width:38px; height:38px; cursor:pointer; font-size:1.55rem; line-height:1; flex-shrink:0; }
.icon-button:hover { background:#f3f1eb; }
.base-form { font-size:.83rem; margin:7px 0 0; color:#677179; }
.divider { height:1px; background:var(--border); margin:23px 0 24px; }
.syllable-heading { color:#677179; font-size:.78rem; font-weight:700; margin:0 0 11px; text-transform:uppercase; letter-spacing:.07em; }
.syllables { display:flex; flex-wrap:wrap; gap:7px; margin:0 0 22px; align-items:stretch; }
.syllable { display:flex; flex-direction:column; justify-content:center; align-items:center; min-width:48px; min-height:63px; padding:9px 12px; background:#f1f1ec; border-radius:9px; color:#35454a; border:2px solid transparent; font-family:Georgia,"Times New Roman",serif; font-size:1.45rem; font-weight:600; }
.syllable small { font-family:system-ui,sans-serif; font-size:.59rem; font-weight:800; letter-spacing:.045em; text-transform:uppercase; margin-top:3px; }
.syllable.primary { background:var(--accent-soft); color:#0b5360; border-color:var(--accent); }
.syllable.secondary { background:var(--accent2-soft); border-color:var(--accent2); color:#8d431d; }
.legend { display:flex; flex-wrap:wrap; gap:15px 18px; margin-bottom:18px; font-size:.85rem; }
.legend-item { display:flex; align-items:center; gap:8px; }
.swatch { height:11px; width:11px; border-radius:3px; background:var(--accent); }
.swatch.accent2 { background:var(--accent2); }
.note { font-size:.82rem; color:#677179; line-height:1.5; margin:0 0 20px; }
.audio-row { display:flex; align-items:center; gap:12px; }
.play { background:var(--accent); color:white; border:0; border-radius:9px; display:flex; align-items:center; justify-content:center; gap:10px; padding:12px 18px; cursor:pointer; font-size:.94rem; font-weight:700; min-height:47px; }
.play:hover { background:#0d4e57; }
.play:disabled { opacity:.55; cursor:not-allowed; }
.audio-status { min-height:1.2em; margin:12px 0 0; font-size:.8rem; color:#677179; }
.modal button:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
@media (max-width:600px) { .shell { padding:48px 21px 70px; } .story { line-height:1.85; } .syllable { font-size:1.26rem; min-height:56px; padding:8px 10px; min-width:43px; } }
</style>

const SYLLABLE_MAP = {"augusti":["au","gus","ti"],"anlände":["an","län","de"],"anonym":["a","no","nym"],"besökare":["be","sö","ka","re"],"antikt":["an","tikt"],"föremål":["fö","re","mål"],"fotografi":["fo","to","gra","fi"],"försvunnen":["för","svun","nen"],"artist":["ar","tist"],"föreståndare":["fö","re","stån","da","re"],"begåvad":["be","gå","vad"],"arkeolog":["ar","ke","o","log"],"förflutet":["för","flu","tet"],"psykologin":["psy","ko","lo","gin"],"ana":["a","na"],"besöket":["be","sö","ket"],"berättelse":["be","rät","tel","se"],"förräderi":["för","rä","de","ri"],"förlust":["för","lust"],"förlåtelse":["för","lå","tel","se"],"fotografiets":["fo","to","gra","fi","ets"],"anteckning":["an","teck","ning"],"förvara":["för","va","ra"],"arkivet":["ar","ki","vet"],"annars":["an","nars"],"förgöra":["för","gö","ra"],"beviset":["be","vi","set"],"anlitade":["an","li","ta","de"],"analytiker":["a","na","ly","ti","ker"],"analysera":["a","na","ly","se","ra"],"fotografiet":["fo","to","gra","fi","et"],"arkitekt":["ar","ki","tekt"],"bedöma":["be","dö","ma"],"arkitektur":["ar","ki","tek","tur"],"analytikern":["a","na","ly","ti","kern"],"förfalskning":["för","falsk","ning"],"annons":["an","nons"],"föreställning":["fö","re","ställ","ning"],"förteckning":["för","teck","ning"],"förteckningen":["för","teck","ning","en"],"belopp":["be","lopp"],"begäran":["be","gä","ran"],"bevara":["be","va","ra"],"melodi":["me","lo","di"],"försökt":["för","sökt"],"förbjuda":["för","bju","da"],"föreståndaren":["fö","re","stån","da","ren"],"bekräfta":["be","kräf","ta"],"besked":["be","sked"],"förvaltare":["för","val","ta","re"],"försök":["för","sök"],"förundersökning":["för","un","der","sök","ning"],"förvaltaren":["för","val","ta","ren"],"förklarade":["för","kla","ra","de"],"betydande":["be","ty","dan","de"],"försäljning":["för","sälj","ning"],"förestående":["fö","re","stå","en","de"],"försvåra":["för","svå","ra"],"besvärlig":["be","svär","lig"],"förhandling":["för","hand","ling"],"förstod":["för","stod"],"bes const $ = (id) => document.getElementById(id);
const storyEl = $('story');
const wordPattern = /(\p{L}+(?:[’'-]\p{L}+)*)/gu;
let activeWord = null;
let previousFocus = null;

function renderStory() {
  storyEl.replaceChildren();
  STORY.forEach((sentence, i) => {
    if (i % 5 === 0) {
      const p = document.createElement('p');
      storyEl.appendChild(p);
    }
    const p = storyEl.lastElementChild;
    const nodes = sentence.split(wordPattern);
    for (const str of nodes) {
      const key = str.toLocaleLowerCase('sv-SE');
      const lemma = FORM_LINKS[key];
      if (lemma && LEXICON[lemma] && SYLLABLE_MAP[key]) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'word';
        btn.textContent = str;
        btn.addEventListener('click', () => openWord(str,key,lemma));
        p.appendChild(btn);
      } else {
        p.appendChild(document.createTextNode(str));
      }
    }
    if (i % 5 !== 4 && i !== STORY.length - 1) p.appendChild(document.createTextNode(' '));
  });
}

function openWord(display, key, lemma) {
  previousFocus = document.activeElement;
  activeWord = display;
  window.speechSynthesis?.cancel();
  $('audioStatus').textContent = '';
  $('modalTitle').textContent = display;
  $('baseForm').textContent = key === lemma ? 'Uppslagsord' : `Böjd form av ”${lemma}”`;
  const [expectedSyllables, mainStress, accent2] = LEXICON[lemma];
  const parts = SYLLABLE_MAP[key];
  $('syllables').replaceChildren();
  parts.forEach((part,i) => {
    const pos = i + 1;
    const unit = document.createElement('div');
    unit.className = 'syllable' + (pos === mainStress ? ' primary' : (pos === accent2 ? ' secondary' : ''));
    const syllableText = document.createElement('span');
    syllableText.textContent = part;
    unit.appendChild(syllableText);
    if (pos === mainStress || pos === accent2) {
      const small = document.createElement('small');
      small.textContent = pos === mainStress ? 'Huvud' : 'Accent 2';
      unit.appendChild(small);
    }
    $('syllables').appendChild(unit);
  });
  $('legend').replaceChildren();
  for (const [label, css] of [['Huvudbetoning',''], ...(accent2 ? [['Accent 2','accent2']] : [])]) {
    const legend = document.createElement('span');
    legend.className = 'legend-item';
    const square = document.createElement('span');
    square.className = 'swatch ' + css;
    square.setAttribute('aria-hidden','true');
    legend.append(square,document.createTextNode(label));
    $('legend').append(legend);
  }
  const baseNote = key === lemma ? '' : ` Grundformen har ${expectedSyllables} stavelser; den här formen har ${parts.length}.`;
  $('modalNote').textContent = `Huvudbetoning på stavelse ${mainStress}` + (accent2 ? `; accent 2 markerad på stavelse ${accent2}.` : '; ingen accent 2 angiven i databasen.') + baseNote;
  $('backdrop').hidden = false;
  document.body.style.overflow='hidden';
  $('closeModal').focus();
}

function closeWord() {
  window.speechSynthesis?.cancel();
  $('backdrop').hidden = true;
  document.body.style.overflow='';
  if (previousFocus && previousFocus.isConnected) previousFocus.focus();
  activeWord = null;
}
$('closeModal').addEventListener('click',closeWord);
$('backdrop').addEventListener('click',e => { if(e.target === $('backdrop')) closeWord(); });
document.addEventListener('keydown', e => {
  if ($('backdrop').hidden) return;
  if (e.key === 'Escape') { closeWord(); return; }
  if (e.key === 'Tab') {
    const focusables = [...$('backdrop').querySelectorAll('button:not([disabled]), select')];
    const first = focusables[0], last = focusables[focusables.length-1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
if (!canSpeak) {
  $('playAudio').disabled=true;
  $('audioStatus').textContent='Webbläsaren saknar talsyntes.';
}
$('playAudio').addEventListener('click', () => {
  if (!canSpeak || !activeWord) return;
  const synth=window.speechSynthesis;
  synth.cancel();
  const speech=new SpeechSynthesisUtterance(activeWord);
  speech.lang='sv-SE';
  speech.rate=0.7;
  speech.pitch=1;
  const voices=synth.getVoices();
  const swedish = voices.find(v=>v.lang.toLowerCase()==='sv-se') || voices.find(v=>v.lang.toLowerCase().startsWith('sv'));
  if (swedish) speech.voice=swedish;
  $('audioStatus').textContent=swedish ? 'Spelar upp ordet.' : 'Spelar upp. Ingen svensk röst hittades; uttalet kan avvika.';
  speech.onerror=()=>{$('audioStatus').textContent='Uppspelningen kunde inte genomföras.';};
  speech.onend=()=>{$('audioStatus').textContent='Uppspelning klar.';};
  synth.speak(speech);
});
renderStory();
</script>
