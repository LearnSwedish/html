<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vilken vecka? Vilka dagar?</title>
  <link rel="icon" href="https://learnswedish.github.io/html/calfav.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">
  <style>
    :root { --blue:#007bff; --blue-dark:#0056b3; --ink:#333; --border:#ccc; --range:#dcecff; --gold:#ffd700; }
    * { box-sizing: border-box; }
    html { min-height:100%; margin:0; overflow-y:scroll; scrollbar-gutter:stable; }
    body { min-height:100%; margin:0; }
    body { font-family:'Work Sans',sans-serif; background:#f4f4f9; color:var(--ink); padding:15px; }
    .container { width:min(1120px,100%); margin:0 auto; padding:20px; border:1px solid var(--border); background:#fff; box-shadow:0 4px 8px rgba(0,0,0,.2); border-radius:10px; text-align:center; }
    h1 { font-size:1.5rem; margin:0 0 10px; font-weight:500; }
    p { margin:.45rem 0; }
    .view-switch { display:inline-flex; gap:4px; padding:4px; margin:15px 0 20px; border-radius:9px; background:#ececf1; }
    .view-tab { width:132px; border:0; border-radius:6px; padding:9px 12px; font:500 1rem inherit; background:transparent; cursor:pointer; color:#333; }
    .view-tab.active { color:#fff; background:#555; box-shadow:0 2px 4px rgba(0,0,0,.15); }
    .view { width:100%; }
    .view[hidden] { display:none; }
    .input-container { display:flex; width:100%; flex-direction:column; align-items:center; gap:18px; }
    #weekView .input-container { gap:0; }
    .button-group { display:flex; width:100%; gap:8px; flex-wrap:wrap; justify-content:center; }
    .button { background:#fff; color:#000; border:2px solid #555; padding:9px 14px; display:inline-flex; align-items:center; gap:8px; font:inherit; transition:.2s; cursor:pointer; border-radius:6px; box-shadow:0 2px 4px rgba(0,0,0,.1); }
    .button:hover, .button:focus-visible { background:#555; color:#fff; }
    input[type="date"] { width:14ch; padding:8px; border:1px solid var(--border); border-radius:5px; font:1rem 'Work Sans',sans-serif; box-shadow:0 2px 4px rgba(0,0,0,.1); }
    .date-picker-trigger { min-width:210px; justify-content:center; }
    .date-picker-trigger .fa-calendar-days { color:var(--blue); }
    .slider-group { display:flex; align-items:center; width:100%; }
    .slider-group label { width:70px; text-align:right; font-size:1.25rem; flex-shrink:0; }
    .slider-container { display:flex; align-items:center; flex:1; gap:15px; padding:0 25px; }
    input[type="range"] { flex:1; accent-color:var(--blue); }
    .slider-value { width:55px; text-align:right; font-size:1.25rem; font-variant-numeric:tabular-nums; }
    #weekdays, #monthDays { width:100%; margin-top:20px; text-align:left; }
    #weekdays ul, #monthDays ul { list-style:none; padding:0; margin:0; }
    #weekdays li, #monthDays li { display:flex; align-items:center; gap:10px; min-height:36px; padding:6px 10px; border:2px solid transparent; border-radius:4px; }
    #weekdays li:nth-child(even), #monthDays li:nth-child(even) { background:#d1cecd; }
    #weekdays li.highlight, #monthDays li.highlight { background:var(--gold); font-weight:700; }
    #weekdays li.selected-pulse, #monthDays li.selected-pulse { animation:selected-row-pulse 2s ease-in-out; }
    #weekdays li.search-marked, #monthDays li.search-marked { border-width:3px; border-color:var(--blue); padding:5px 9px; box-shadow:0 0 0 3px rgba(0,123,255,.18); }
    .month-week { width:58px; flex-shrink:0; color:#536983; font-weight:600; font-variant-numeric:tabular-nums; }
    .date { width:195px; }
    .holiday { color:#b83532; font-weight:700; }
    .holiday-more { display:flex; align-items:center; justify-content:space-between; gap:12px; flex:1; padding:0; border:0; background:transparent; font-family:inherit; font-size:inherit; font-weight:700; color:#b83532; text-align:left; cursor:pointer; }
    .holiday-more i { flex-shrink:0; margin-left:auto; color:#555; }
    .holiday-more:hover, .holiday-more:focus-visible { text-decoration:none; outline:none; }
    .holiday-more:hover span, .holiday-more:focus-visible span { text-decoration:underline; }
    .event-modal-text { text-align:left; line-height:1.55; color:#b83532; font-weight:700; }
    .event-modal-text ul { margin:0; padding-left:1.2rem; }
    .event-modal-text li + li { margin-top:8px; }
    .year-toolbar { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .year-toolbar strong { min-width:72px; font-size:1.5rem; font-variant-numeric:tabular-nums; }
    .week-slider-wrap, .year-slider-wrap { display:flex; align-items:center; justify-content:center; column-gap:8px; row-gap:10px; width:calc(100% - 130px); margin:0 90px 16px 40px; }
    #weekView .week-slider-wrap:first-of-type { margin-bottom:8px; }
    #monthView .year-slider-wrap, #yearView .year-slider-wrap { margin-bottom:8px; }
    .year-view-spacer { height:41px; margin:0 90px 16px 40px; }
    .week-slider-wrap label, .year-slider-wrap label { display:grid; grid-template-columns:6ch 4ch; align-items:baseline; gap:0; width:120px; text-align:left; flex-shrink:0; }
    .week-slider-wrap strong, .year-slider-wrap strong { display:inline-block; min-width:0; font-size:1.4rem; font-variant-numeric:tabular-nums; text-align:right; }
    #weekResult { text-align:left; }
    .week-slider-wrap .button, .year-slider-wrap .button { flex-shrink:0; }
    .week-slider-wrap input, .year-slider-wrap input { flex:1; }
    .week-status { min-height:1.2em; margin:-9px 0 9px; color:#626d79; font-size:.9rem; }
    .date-tools, .range-tools { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
    .date-tools { width:calc(100% - 130px); margin:0 90px 0 40px; padding-left:128px; box-sizing:border-box; justify-content:flex-start; }
    .date-tools .button, .range-tools .button { width:130px; min-width:0; justify-content:center; }
    .event-search { width:485px; min-width:0; padding:9px 12px; border:2px solid #555; border-radius:6px; font:inherit; box-shadow:0 2px 4px rgba(0,0,0,.1); }
    .event-search:focus { outline:2px solid rgba(0,123,255,.25); outline-offset:2px; }
    .range-help { padding:10px; margin:0 auto 18px; border:1px solid #c9d9ef; border-radius:8px; background:#f5f9ff; font-size:.9rem; color:#555; }
    .range-tools { margin:0 auto 28px; }
    .modal-backdrop { position:fixed; inset:0; z-index:1000; display:flex; align-items:center; justify-content:center; padding:20px; background:rgba(20,25,35,.58); animation:fade-in .18s ease-out; }
    .modal-backdrop[hidden] { display:none; }
    .result-modal { position:relative; width:min(580px,100%); padding:34px 28px 26px; border-radius:12px; background:#fff; box-shadow:0 18px 55px rgba(0,0,0,.32); text-align:center; animation:modal-in .22s ease-out; }
    .result-modal h2 { margin:0 32px 14px; font-size:1.28rem; text-align:center; }
    #eventModalTitle { margin-bottom:22px; }
    #rangeResult { font-size:1.08rem; line-height:1.5; }
    #rangeResult strong { color:var(--blue-dark); font-size:1.2rem; }
    .result-row { display:flex; align-items:baseline; justify-content:space-between; gap:20px; padding:10px 0; border-bottom:1px solid #e2e7ed; text-align:left; }
    .result-row:last-of-type { border-bottom:0; }
    .result-row strong { white-space:nowrap; font-variant-numeric:tabular-nums; }
    .result-dates { margin-top:12px; color:#626d79; font-size:.9rem; }
    .modal-actions { display:flex; justify-content:center; margin-top:20px; }
    .modal-close { position:absolute; top:10px; right:10px; width:40px; height:40px; border:0; border-radius:50%; background:transparent; color:#555; font-size:1.5rem; cursor:pointer; transition:background-color .2s,color .2s,transform .25s ease; }
    .modal-close:hover, .modal-close:focus-visible { background:#555; color:#fff; transform:rotate(90deg) scale(1.08); outline:none; }
    .picker-nav { display:grid; grid-template-columns:42px 42px 1fr 42px 42px; align-items:center; gap:5px; margin-bottom:14px; }
    .picker-nav button { width:38px; height:38px; border:1px solid #d8e0e9; border-radius:7px; background:#f7faff; color:#35465a; cursor:pointer; transition:.18s; }
    .picker-nav button:hover, .picker-nav button:focus-visible { background:var(--blue); color:#fff; border-color:var(--blue); }
    .picker-nav strong { text-align:center; text-transform:capitalize; color:#26384d; }
    .picker-grid { display:grid; grid-template-columns:1.05fr repeat(7,1fr); gap:5px; }
    .picker-weekday { padding:4px 0; color:#6c7887; font-size:.78rem; font-weight:700; text-align:center; }
    .picker-week-number { display:flex; align-items:center; justify-content:center; border-right:1px solid #dce3eb; border-radius:4px 0 0 4px; background:#f4f7fa; color:#718095; font-size:.72rem; font-weight:700; }
    .picker-day, .picker-empty { aspect-ratio:1; }
    .picker-day { border:0; border-radius:50%; background:transparent; color:#253447; font:500 .9rem 'Work Sans',sans-serif; cursor:pointer; transition:.16s; }
    .picker-day:hover, .picker-day:focus-visible { background:#e6f1ff; color:#004eaa; outline:2px solid var(--blue); outline-offset:-2px; transform:scale(1.06); }
    .picker-day.weekend { color:#a42d2a; }
    .picker-day.picker-today { box-shadow:inset 0 0 0 2px #777; }
    .picker-day.picker-selected { background:var(--blue); color:#fff; font-weight:700; box-shadow:0 2px 7px rgba(0,123,255,.35); }
    .picker-footer { margin-top:16px; display:flex; justify-content:center; }
    @keyframes fade-in { from { opacity:0; } }
    @keyframes modal-in { from { opacity:0; transform:translateY(14px) scale(.97); } }
    @keyframes selected-row-pulse {
      0%, 16%, 34%, 50%, 68%, 84%, 100% { border-color:transparent; box-shadow:none; }
      8%, 42%, 76% { border-color:var(--blue); box-shadow:0 0 0 3px rgba(0,123,255,.16); }
    }
    .year-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; text-align:center; }
    .month { overflow:hidden; border:1px solid #d9e0e8; border-radius:11px; padding:0 10px 11px; background:linear-gradient(180deg,#f7faff 0,#fff 42px); box-shadow:0 3px 10px rgba(44,62,80,.08); transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease; }
    .month:hover { transform:translateY(-2px); border-color:#b8cbe3; box-shadow:0 7px 18px rgba(44,62,80,.13); }
    .month h3 { margin:0 -10px 8px; padding:9px 8px; font-size:1rem; font-weight:700; text-transform:capitalize; color:#26384d; background:linear-gradient(135deg,#edf5ff,#f8fbff); border-bottom:1px solid #dce7f3; }
    .month-grid { display:grid; grid-template-columns:1.15fr repeat(7,1fr); gap:3px; }
    .weekday-head { font-size:.72rem; color:#607086; padding:4px 0 5px; font-weight:700; }
    .week-number { display:flex; align-items:center; justify-content:center; color:#758398; font-size:.68rem; font-weight:700; border-right:1px solid #dce3eb; background:#f6f8fb; border-radius:3px 0 0 3px; }
    .day, .empty-day { aspect-ratio:1; min-width:0; }
    .day { border:0; border-radius:50%; background:transparent; font:500 .79rem 'Work Sans',sans-serif; cursor:pointer; position:relative; z-index:0; transition:background-color .15s,color .15s,transform .15s; }
    .day:hover, .day:focus-visible { outline:2px solid var(--blue); outline-offset:-2px; background:#edf5ff; transform:scale(1.08); }
    .day.weekend { color:#a42d2a; }
    .day.today { box-shadow:inset 0 0 0 2px #555; }
    .day.in-range { background:var(--range); border-radius:4px; }
    .day.range-start, .day.range-end { background:var(--blue); color:#fff; border-radius:50%; font-weight:700; }
    .day.range-start.range-end { background:#6f42c1; }
    .legend { display:flex; justify-content:center; gap:18px; flex-wrap:wrap; font-size:.82rem; margin-top:14px; color:#555; }
    .legend span::before { content:""; display:inline-block; width:12px; height:12px; margin-right:5px; vertical-align:-2px; border-radius:3px; background:var(--range); }
    .legend .endpoint::before { background:var(--blue); border-radius:50%; }
    @media (max-width:800px) { .year-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media (max-width:640px) {
      body { padding:8px; background:#f7f8fb; }
      .container { width:100%; padding:16px 12px 18px; border-radius:14px; box-shadow:0 6px 18px rgba(32,40,55,.12); }
      h1 { font-size:1.35rem; line-height:1.2; margin-bottom:8px; }
      #intro { max-width:33ch; margin:0 auto; font-size:.94rem; line-height:1.45; color:#4c5563; }
      .view-switch { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); width:100%; gap:5px; margin:14px 0 18px; padding:5px; }
      .view-tab { width:auto; min-width:0; padding:10px 4px; font-size:.82rem; line-height:1.1; white-space:nowrap; }
      .view-tab i { display:block; margin:0 auto 4px; font-size:.95rem; }
      .input-container { gap:12px; }
      #weekView .input-container { gap:0; }
      .week-slider-wrap, .year-slider-wrap {
        display:grid;
        grid-template-columns:44px minmax(0,1fr) 44px;
        grid-template-areas:
          "label label label"
          "prev range next";
        width:100%;
        margin:0 0 12px;
        column-gap:8px;
        row-gap:7px;
      }
      #weekView .week-slider-wrap:first-of-type, #monthView .year-slider-wrap, #yearView .year-slider-wrap { margin-bottom:12px; }
      .week-slider-wrap label, .year-slider-wrap label {
        grid-area:label;
        justify-self:center;
        width:auto;
        grid-template-columns:auto auto;
        gap:6px;
        font-size:.98rem;
      }
      .week-slider-wrap strong, .year-slider-wrap strong { font-size:1.28rem; text-align:left; }
      #weekResult { text-align:left; }
      .week-slider-wrap label + .button, .year-slider-wrap label + .button { grid-area:prev; }
      .week-slider-wrap input + .button, .year-slider-wrap input + .button { grid-area:next; }
      .week-slider-wrap input, .year-slider-wrap input { grid-area:range; width:100%; min-width:0; }
      .week-slider-wrap .button, .year-slider-wrap .button {
        width:44px;
        height:42px;
        padding:0;
        justify-content:center;
        gap:0;
        font-size:0;
        border-radius:10px;
      }
      .week-slider-wrap .button i, .year-slider-wrap .button i { font-size:1rem; }
      .week-status { min-height:1em; margin:-4px 0 10px; font-size:.82rem; line-height:1.3; }
      .date-tools {
        display:grid;
        grid-template-columns:1fr 1fr;
        width:100%;
        margin:0;
        padding-left:0;
        gap:9px;
      }
      .event-search { grid-column:1 / -1; width:100%; min-height:44px; font-size:1rem; border-radius:10px; }
      .date-tools .button, .range-tools .button, .date-picker-trigger { width:100%; min-width:0; min-height:44px; border-radius:10px; }
      #weekdays, #monthDays { margin-top:16px; }
      #weekdays li, #monthDays li { align-items:start; min-height:0; padding:9px 10px; border-radius:8px; gap:5px 10px; }
      #weekdays li { display:grid; grid-template-columns:minmax(0,1fr); }
      #monthDays li { display:grid; grid-template-columns:50px minmax(0,1fr); }
      #weekdays li.search-marked, #monthDays li.search-marked { padding:8px 9px; }
      .month-week { width:auto; padding-top:1px; font-size:.82rem; }
      .date { width:auto; min-width:0; font-size:.92rem; line-height:1.35; }
      .holiday, .holiday-more { grid-column:1 / -1; font-size:.9rem; line-height:1.35; }
      .holiday-more { align-items:flex-start; gap:10px; }
      .year-view-spacer { display:none; }
      .range-tools { display:grid; grid-template-columns:1fr 1fr; width:100%; margin:0 0 18px; gap:9px; }
      .range-help { grid-column:1 / -1; width:100%; margin:0; line-height:1.4; }
      .year-grid { grid-template-columns:1fr; gap:14px; }
      .month { border-radius:10px; padding:0 8px 10px; }
      .month-grid { gap:4px; }
      .weekday-head { font-size:.68rem; }
      .day { font-size:.78rem; }
      .modal-backdrop { padding:10px; align-items:flex-start; overflow:auto; }
      .result-modal { width:100%; margin:18px 0; padding:32px 20px 24px; border-radius:14px; }
      .result-modal h2 { margin-left:38px; margin-right:38px; }
      .picker-nav { grid-template-columns:38px 38px 1fr 38px 38px; gap:4px; }
      .picker-nav button { width:36px; height:36px; }
      .picker-grid { gap:4px; }
    }
    @media (max-width:380px) {
      .container { padding:14px 9px 16px; }
      .view-tab { font-size:.76rem; }
      .week-slider-wrap, .year-slider-wrap { grid-template-columns:40px minmax(0,1fr) 40px; }
      .week-slider-wrap .button, .year-slider-wrap .button { width:40px; height:40px; }
      #monthDays li { grid-template-columns:44px minmax(0,1fr); }
      .date { font-size:.88rem; }
      .holiday, .holiday-more { font-size:.86rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Vilken vecka? Vilka dagar?</h1>
    <p id="intro">Välj datum, se veckonumret. Ändra och se vilka dagar veckan innehåller.</p>
    <nav class="view-switch" aria-label="Välj kalendervy">
      <button class="view-tab active" id="weekTab" aria-controls="weekView" aria-selected="true"><i class="fa-regular fa-calendar"></i> Veckovy</button>
      <button class="view-tab" id="monthTab" aria-controls="monthView" aria-selected="false"><i class="fa-regular fa-calendar-days"></i> Månadsvy</button>
      <button class="view-tab" id="yearTab" aria-controls="yearView" aria-selected="false"><i class="fa-solid fa-calendar-days"></i> Årsvy</button>
    </nav>

    <section id="weekView" class="view">
      <div class="input-container">
        <input type="hidden" id="dateInput">
        <div class="week-slider-wrap"><label for="yearSlider">År <strong id="yearResult">1950</strong></label><button class="button" id="decreaseYearBtn"><i class="fa-solid fa-chevron-left"></i> Föregående</button><input type="range" id="yearSlider" min="1950" max="2100"><button class="button" id="increaseYearBtn">Nästa <i class="fa-solid fa-chevron-right"></i></button></div>
        <div class="week-slider-wrap"><label for="weekSlider">Vecka <strong id="weekResult">1</strong></label><button class="button" id="decreaseWeekBtn"><i class="fa-solid fa-chevron-left"></i> Föregående</button><input type="range" id="weekSlider" min="1" max="53"><button class="button" id="increaseWeekBtn">Nästa <i class="fa-solid fa-chevron-right"></i></button></div>
        <div class="week-status" id="weekStatus" aria-live="polite"></div>
        <div class="date-tools"><input class="event-search" id="weekEventSearch" type="search" list="eventSuggestions" placeholder="Sök händelse" autocomplete="off" aria-label="Sök händelse"><button class="button date-picker-trigger" id="openDatePicker" type="button"><i class="fa-solid fa-calendar-days"></i><span id="selectedDateLabel">Datum</span></button><button class="button" id="todayBtn"><i class="fa-solid fa-calendar-day"></i> Idag</button></div>
      </div>
      <div id="weekdays" aria-live="polite"></div>
    </section>

    <section id="monthView" class="view" hidden>
      <div class="year-slider-wrap"><label for="monthYearSlider">År <strong id="monthYearLabel"></strong></label><button class="button" id="previousMonthYear" aria-label="Föregående år"><i class="fa-solid fa-chevron-left"></i> Föregående</button><input type="range" id="monthYearSlider" min="1950" max="2100"><button class="button" id="nextMonthYear">Nästa <i class="fa-solid fa-chevron-right"></i></button></div>
      <div class="week-slider-wrap"><label for="monthSlider">Månad <strong id="monthResult"></strong></label><button class="button" id="decreaseMonthBtn"><i class="fa-solid fa-chevron-left"></i> Föregående</button><input type="range" id="monthSlider" min="0" max="11"><button class="button" id="increaseMonthBtn">Nästa <i class="fa-solid fa-chevron-right"></i></button></div>
      <div class="week-status" aria-hidden="true"></div>
      <div class="date-tools"><input class="event-search" id="monthEventSearch" type="search" list="eventSuggestions" placeholder="Sök händelse" autocomplete="off" aria-label="Sök händelse"><button class="button date-picker-trigger" id="monthOpenDatePicker" type="button"><i class="fa-solid fa-calendar-days"></i><span>Datum</span></button><button class="button" id="monthTodayBtn"><i class="fa-solid fa-calendar-day"></i> Idag</button></div>
      <div id="monthDays" aria-live="polite"></div>
    </section>

    <section id="yearView" class="view" hidden>
      <div class="year-slider-wrap"><label for="calendarYearSlider">År <strong id="calendarYearLabel"></strong></label><button class="button" id="previousCalendarYear" aria-label="Föregående år"><i class="fa-solid fa-chevron-left"></i> Föregående</button><input type="range" id="calendarYearSlider" min="1950" max="2100"><button class="button" id="nextCalendarYear">Nästa <i class="fa-solid fa-chevron-right"></i></button></div>
      <div class="year-view-spacer" aria-hidden="true"></div>
      <div class="week-status" aria-hidden="true"></div>
      <div class="range-tools">
        <div class="range-help" id="selectionStatus" aria-live="polite" hidden>Klicka på ett startdatum och därefter på ett slutdatum. Antalet kalenderdagar räknas inklusive båda datumen.</div>
        <button class="button" id="clearRangeBtnOutside" type="button"><i class="fa-solid fa-eraser"></i> Rensa</button>
        <button class="button" id="calendarTodayBtn"><i class="fa-solid fa-calendar-day"></i> I år</button>
      </div>
      <div id="yearGrid" class="year-grid"></div>
    </section>
  </main>
  <datalist id="eventSuggestions"></datalist>
  <div class="modal-backdrop" id="datePickerBackdrop" hidden>
    <section class="result-modal" role="dialog" aria-modal="true" aria-labelledby="datePickerTitle">
      <button class="modal-close" id="closeDatePicker" type="button" aria-label="Stäng datumväljaren"><i class="fa-solid fa-xmark"></i></button>

    function validISODate(year, monthDay) {

      return date.getFullYear()===year&&date.getMonth()===month-1&&date.getDate()===day?toISO(date):null;
    }
    function nextFixedISO(monthDay,startDate=new Date()) {
      const startISO=toISO(startDate), start=utcDay(startISO);
      for(let year=startDate.getFullYear();year<=startDate.getFullYear()+8;year++){
        const iso=validISODate(year,monthDay);
        if(iso&&utcDay(iso)>=start)return iso;
      }
      return validISODate(startDate.getFullYear(),monthDay);
    }
    function eventSearchItems() {
      const today=new Date(), todayTime=utcDay(toISO(today)), byEvent=new Map();
      const add=(event,iso)=>{
        if(!iso||utcDay(iso)<todayTime)return;
        const key=event.toLocaleLowerCase('sv'), existing=byEvent.get(key);
        if(!existing||utcDay(iso)<utcDay(existing.iso))byEvent.set(key,{event,iso});
      };
      Object.entries(fixedHolidays).forEach(([monthDay,text])=>splitEvents(text).forEach(event=>add(event,nextFixedISO(monthDay,today))));
      Object.entries(nationalDays).forEach(([monthDay,text])=>splitEvents(text).forEach(event=>add(event,nextFixedISO(monthDay,today))));
      for(let year=today.getFullYear();year<=today.getFullYear()+8;year++){
        Object.entries(movableHolidays(year)).forEach(([monthDay,text])=>splitEvents(text).forEach(event=>add(event,validISODate(year,monthDay))));
      }
      return [...byEvent.values()].sort((a,b)=>a.event.localeCompare(b.event,'sv'));
    }
    function updateEventSuggestions(query='') {
      const needle=query.trim().toLocaleLowerCase('sv'), seen=new Set();
      if(!needle){$('eventSuggestions').innerHTML='';return;}
      const options=eventSearchItems().filter(item=>item.event.toLocaleLowerCase('sv').includes(needle)).filter(item=>{
        const key=item.event.toLocaleLowerCase('sv');
        if(seen.has(key))return false; seen.add(key); return true;
      }).slice(0,20).map(item=>`<option value="${item.event}"></option>`).join('');
      $('eventSuggestions').innerHTML=options;
    }
    function renderActiveSearchView() {
      if(activeView==='month')renderMonth();
      else if(activeView==='week')updateWeekView();
    }
    function clearSearchMark(render=false) {
      const marked=searchMarkedDate;
      if(!marked)return;
      searchMarkedDate=null;
      if(pulsingDate===marked){
        pulsingDate=null;
        clearTimeout(pulseTimer);
      }
      if(render)renderActiveSearchView();
    }
    function pulseShownDate(iso, markAfterPulse=false) {
      pulsingDate=iso; clearTimeout(pulseTimer);
      searchMarkedDate=markAfterPulse?iso:null;
      pulseTimer=setTimeout(()=>{if(pulsingDate===iso){pulsingDate=null;renderActiveSearchView();}},2000);
    }
    function showEventDate(iso) {
      const date=parseISO(iso); selectedDate=new Date(date); pulseShownDate(iso,activeView==='month'||activeView==='week');
      if(activeView==='month'){monthViewYear=date.getFullYear();monthViewMonth=date.getMonth();renderMonth();}
      else updateWeekView(date);
    }
    function runEventSearch(input) {
      const query=input.value.trim().toLocaleLowerCase('sv');
      if(!query)return;
      const match=eventSearchItems().find(item=>item.event.toLocaleLowerCase('sv')===query)||eventSearchItems().find(item=>item.event.toLocaleLowerCase('sv').includes(query));
      if(match){input.value=match.event;$('eventSuggestions').innerHTML='';showEventDate(match.iso);}
    }
    function clearEventSearches() {
      $('weekEventSearch').value=''; $('monthEventSearch').value=''; $('eventSuggestions').innerHTML='';
    }
    function renderYear() {
      $('calendarYearLabel').textContent=calendarYear; $('calendarYearSlider').value=calendarYear; const today=toISO(new Date()); let html='';
      for(let month=0;month<12;month++){
        const first=new Date(calendarYear,month,1,12), offset=(first.getDay()+6)%7, days=new Date(calendarYear,month+1,0,12).getDate(), rows=Math.ceil((offset+days)/7);
        html+=`<article class="month"><h3>${monthNames[month]}</h3><div class="month-grid"><span class="weekday-head" title="Vecka">v.</span>${shortWeekdays.map(d=>`<span class="weekday-head">${d}</span>`).join('')}`;
        for(let row=0;row<rows;row++){
          const monday=new Date(calendarYear,month,1-offset+row*7,12); html+=`<span class="week-number" title="Vecka ${isoWeekData(monday).week}">${isoWeekData(monday).week}</span>`;
          for(let column=0;column<7;column++){
            const day=row*7+column-offset+1;
            if(day<1||day>days){html+='<span class="empty-day"></span>';continue;}
            const iso=`${calendarYear}-${pad(month+1)}-${pad(day)}`, dow=new Date(calendarYear,month,day,12).getDay(), u=utcDay(iso), start=rangeStart&&utcDay(rangeStart), end=rangeEnd&&utcDay(rangeEnd), classes=['day']; if(dow===0||dow===6)classes.push('weekend');if(iso===today)classes.push('today');if(rangeStart&&rangeEnd&&u>Math.min(start,end)&&u<Math.max(start,end))classes.push('in-range');if(iso===rangeStart)classes.push('range-start');if(iso===rangeEnd)classes.push('range-end');html+=`<button class="${classes.join(' ')}" data-date="${iso}" aria-label="${displayDate(iso)}, vecka ${isoWeekData(new Date(calendarYear,month,day,12)).week}">${day}</button>`;
          }
        }
        html+='</div></article>';
      } $('yearGrid').innerHTML=html; updateRangeResult();
    }
    function updateRangeResult() {
      if(!rangeStart){$('selectionStatus').textContent='Klicka på ett startdatum och därefter på ett slutdatum. Antalet kalenderdagar räknas inklusive båda datumen.';$('rangeResult').textContent='';return;}
      if(!rangeEnd){$('selectionStatus').innerHTML=`Start valt: <strong>${displayDate(rangeStart)}</strong>. Klicka nu på ett slutdatum.`;$('rangeResult').textContent='';return;}
      const first=utcDay(rangeStart)<=utcDay(rangeEnd)?rangeStart:rangeEnd, last=first===rangeStart?rangeEnd:rangeStart, count=Math.abs(utcDay(rangeEnd)-utcDay(rangeStart))+1;
      $('rangeResult').innerHTML=`<div class="result-row"><span>Totalt omfattade dagar:</span><strong>${count}</strong></div><div class="result-row"><span>Dagar till slutdatum:</span><strong>${count-1}</strong></div><div class="result-dates">Från ${displayDate(first)} till ${displayDate(last)}.</div>`;
      $('selectionStatus').textContent='Intervallet är valt. Klicka på ett nytt datum för att påbörja ett nytt intervall.';
    }
    function openResultModal(){ $('resultModalBackdrop').hidden=false; document.body.style.overflow='hidden'; $('closeResultModal').focus(); }
    function closeResultModal(){ $('resultModalBackdrop').hidden=true; document.body.style.overflow=''; }
    function chooseRangeDate(iso) { if(!rangeStart||rangeEnd){rangeStart=iso;rangeEnd=null;closeResultModal();renderYear();}else{rangeEnd=iso;renderYear();openResultModal();} }
    function setCalendarYear(year){calendarYear=Math.max(1950,Math.min(2100,Number(year)));renderYear();}
    function openEventModal(text) {
      $('eventModalText').innerHTML=`<ul>${splitEvents(text).map(event=>`<li>${escapeHTML(event)}</li>`).join('')}</ul>`;
      $('eventModalBackdrop').hidden=false; document.body.style.overflow='hidden'; $('closeEventModal').focus();
    }
    function closeEventModal() {
      $('eventModalBackdrop').hidden=true; if($('datePickerBackdrop').hidden&&$('resultModalBackdrop').hidden)document.body.style.overflow='';
    }

    function renderDatePicker(){
      const year=pickerDate.getFullYear(),month=pickerDate.getMonth(),first=new Date(year,month,1,12),offset=(first.getDay()+6)%7,days=new Date(year,month+1,0,12).getDate(),today=toISO(new Date()),chosen=toISO(selectedDate);
      $('pickerMonthLabel').textContent=`${monthNames[month]} ${year}`;
      let html='<span class="picker-weekday" title="Vecka">v.</span>'+shortWeekdays.map(day=>`<span class="picker-weekday">${day}</span>`).join('');
      for(let row=0;row<6;row++){
        const monday=new Date(year,month,1-offset+row*7,12),week=isoWeekData(monday).week;
        html+=`<span class="picker-week-number" title="Vecka ${week}">${week}</span>`;
        for(let column=0;column<7;column++){
          const day=row*7+column-offset+1;
          if(day<1||day>days){html+='<span class="picker-empty"></span>';continue;}
          const iso=`${year}-${pad(month+1)}-${pad(day)}`,dow=new Date(year,month,day,12).getDay(),classes=['picker-day'];if(dow===0||dow===6)classes.push('weekend');if(iso===today)classes.push('picker-today');if(iso===chosen)classes.push('picker-selected');html+=`<button class="${classes.join(' ')}" type="button" data-picker-date="${iso}" aria-label="${displayDate(iso)}, vecka ${week}">${day}</button>`;
        }
      }
      $('pickerGrid').innerHTML=html;
    }
    function openDatePicker(){if(activeView==='month'){const days=new Date(monthViewYear,monthViewMonth+1,0,12).getDate();pickerDate=new Date(monthViewYear,monthViewMonth,Math.min(selectedDate.getDate(),days),12);}else pickerDate=new Date(selectedDate);renderDatePicker();$('datePickerBackdrop').hidden=false;document.body.style.overflow='hidden';$('closeDatePicker').focus();}
    function closeDatePickerModal(){$('datePickerBackdrop').hidden=true;if($('resultModalBackdrop').hidden)document.body.style.overflow='';}
    function movePicker(months,years=0){pickerDate=new Date(pickerDate.getFullYear()+years,pickerDate.getMonth()+months,1,12);renderDatePicker();}
    function choosePickerDate(iso){const picked=parseISO(iso);selectedDate=new Date(picked);pulsingDate=iso;clearTimeout(pulseTimer);if(activeView==='month'){monthViewYear=picked.getFullYear();monthViewMonth=picked.getMonth();renderMonth();}else updateWeekView(picked);pulseTimer=setTimeout(()=>{if(pulsingDate===iso){pulsingDate=null;if(activeView==='month')renderMonth();else updateWeekView();}},2000);closeDatePickerModal();$(activeView==='month'?'monthOpenDatePicker':'openDatePicker').focus();}
    function addHoldStepper(id,step) {
      const button=$(id); let startTimer=null, repeatTimer=null, held=false;
      const stop=()=>{clearTimeout(startTimer);clearInterval(repeatTimer);startTimer=null;repeatTimer=null;};
      button.addEventListener('pointerdown',e=>{if(e.button!==0)return;held=false;button.setPointerCapture?.(e.pointerId);step();startTimer=setTimeout(()=>{held=true;repeatTimer=setInterval(step,110);},380);});
      button.addEventListener('pointerup',stop); button.addEventListener('pointercancel',stop); button.addEventListener('pointerleave',stop);
      button.addEventListener('click',e=>{if(held){e.preventDefault();e.stopPropagation();held=false;}});
      button.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!startTimer){step();startTimer=setTimeout(()=>{repeatTimer=setInterval(step,110);},380);}});
      button.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')stop();});
      button.addEventListener('blur',stop);
    }

    function clearSearchMarkForControl(target) {
      if(target.closest?.('.holiday-more'))return;
      if(!target.closest?.('button,input,select,textarea,a,[role="button"]'))return;
      clearSearchMark(true);
    }
    $('weekTab').addEventListener('click',()=>setView('week')); $('monthTab').addEventListener('click',()=>setView('month')); $('yearTab').addEventListener('click',()=>setView('year'));
    ['weekEventSearch','monthEventSearch'].forEach(id=>{const input=$(id);input.addEventListener('focus',()=>updateEventSuggestions(input.value));input.addEventListener('input',()=>{clearSearchMark(true);updateEventSuggestions(input.value);});input.addEventListener('change',()=>runEventSearch(input));input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runEventSearch(input);}});});
    document.addEventListener('pointerdown',e=>{clearSearchMarkForControl(e.target);if(!e.target.closest?.('.event-search'))clearEventSearches();});
    document.addEventListener('focusin',e=>{clearSearchMarkForControl(e.target);if(!e.target.closest?.('.event-search'))clearEventSearches();});
    $('openDatePicker').addEventListener('click',openDatePicker); $('monthOpenDatePicker').addEventListener('click',openDatePicker);
    $('closeDatePicker').addEventListener('click',closeDatePickerModal);
    $('datePickerBackdrop').addEventListener('click',e=>{if(e.target===$('datePickerBackdrop'))closeDatePickerModal();});
    $('pickerPreviousYear').addEventListener('click',()=>movePicker(0,-1)); $('pickerPreviousMonth').addEventListener('click',()=>movePicker(-1)); $('pickerNextMonth').addEventListener('click',()=>movePicker(1)); $('pickerNextYear').addEventListener('click',()=>movePicker(0,1));
    $('pickerGrid').addEventListener('click',e=>{const button=e.target.closest('[data-picker-date]');if(button)choosePickerDate(button.dataset.pickerDate);});
    $('pickerToday').addEventListener('click',()=>choosePickerDate(toISO(new Date())));
    addHoldStepper('decreaseWeekBtn',()=>changeSelected(-7)); addHoldStepper('increaseWeekBtn',()=>changeSelected(7)); addHoldStepper('decreaseYearBtn',()=>changeISOYear(-1)); addHoldStepper('increaseYearBtn',()=>changeISOYear(1)); $('todayBtn').addEventListener('click',()=>updateWeekView(new Date()));
    $('weekSlider').addEventListener('input',e=>setISOWeek(e.target.value,Number($('yearSlider').value))); $('yearSlider').addEventListener('input',e=>setISOWeek($('weekSlider').value,e.target.value));
    addHoldStepper('decreaseMonthBtn',()=>changeMonth(-1)); addHoldStepper('increaseMonthBtn',()=>changeMonth(1)); $('monthSlider').addEventListener('input',e=>setMonth(e.target.value));
    $('monthTodayBtn').addEventListener('click',()=>{const today=new Date();selectedDate=new Date(today);monthViewYear=today.getFullYear();monthViewMonth=today.getMonth();renderMonth();});
    addHoldStepper('previousMonthYear',()=>setMonthYear(monthViewYear-1)); addHoldStepper('nextMonthYear',()=>setMonthYear(monthViewYear+1)); $('monthYearSlider').addEventListener('input',e=>setMonthYear(e.target.value));
    addHoldStepper('previousCalendarYear',()=>setCalendarYear(calendarYear-1)); addHoldStepper('nextCalendarYear',()=>setCalendarYear(calendarYear+1)); $('calendarTodayBtn').addEventListener('click',()=>setCalendarYear(new Date().getFullYear())); $('calendarYearSlider').addEventListener('input',e=>setCalendarYear(e.target.value));
    $('closeResultModal').addEventListener('click',closeResultModal);
    $('resultModalBackdrop').addEventListener('click',e=>{if(e.target===$('resultModalBackdrop'))closeResultModal();});
    $('closeEventModal').addEventListener('click',closeEventModal);
    $('eventModalBackdrop').addEventListener('click',e=>{if(e.target===$('eventModalBackdrop'))closeEventModal();});
    document.addEventListener('click',e=>{const button=e.target.closest?.('.holiday-more');if(button){openEventModal(decodeURIComponent(button.dataset.events));clearSearchMark(true);}});
    document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('eventModalBackdrop').hidden)closeEventModal();else if(!$('datePickerBackdrop').hidden)closeDatePickerModal();else if(!$('resultModalBackdrop').hidden)closeResultModal();});
    function clearRange(){rangeStart=null;rangeEnd=null;closeResultModal();renderYear();}
    $('clearRangeBtn').addEventListener('click',clearRange);
    $('clearRangeBtnOutside').addEventListener('click',clearRange);
    $('yearGrid').addEventListener('click',e=>{const button=e.target.closest('[data-date]');if(button)chooseRangeDate(button.dataset.date);});
    updateWeekView();
  </script>
</body>
</html>
