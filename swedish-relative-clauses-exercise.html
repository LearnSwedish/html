<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swedish Relative Clauses</title>
  <style>
    :root {
      --bg: #f4f1eb;
      --card: #fffaf2;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d9cfc0;
      --accent: #324c5f;
      --accent-light: #e4edf2;
      --good: #217a43;
      --good-bg: #e5f5eb;
      --bad: #a33a2b;
      --bad-bg: #f8e7e4;
      --shadow: 0 22px 50px rgba(31, 41, 51, .14);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 34px 28px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(50, 76, 95, .16), transparent 34rem),
        linear-gradient(135deg, #f7f2ea 0%, #ece6dc 100%);
    }

    main {
      width: min(920px, 100%);
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: baseline;
      margin: 0 0 44px;
      color: var(--muted);
      font-size: .95rem;
    }

    body.exercise-not-started .progress,
    body.exercise-not-started .card,
    body.exercise-not-started .feedback,
    body.exercise-not-started .next-row {
      display: none;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(217, 207, 192, .9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(28px, 4vw, 44px);
      position: relative;
      overflow: visible;
    }

    .card.situation-everyday {
      background: #eff8ef;
      border-color: rgba(77, 148, 91, .35);
    }

    .card.situation-formal {
      background: #fff0ee;
      border-color: rgba(163, 58, 43, .32);
    }

.card.situation-semi-formal {
  background: #eef6fb;
  border-color: rgba(111, 163, 196, .45);
}

.card.situation-semi-formal .situation-icon {
  color: #2f6f95;
  border-color: #6fa3c4;
  box-shadow: 0 0 0 4px rgba(111, 163, 196, .18), 0 14px 32px rgba(31, 41, 51, .16);
}

.card.situation-semi-formal .style-hint {
  color: #2f6f95;
  border-color: rgba(111, 163, 196, .45);
}	

    .card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 8px;
      background: linear-gradient(90deg, var(--accent), #7d938f, #c2a979);
    }

    .situation-icon {
      position: absolute;
      top: -34px;
      right: 30px;
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      border: 1px solid rgba(31, 41, 51, .12);
      box-shadow: 0 14px 32px rgba(31, 41, 51, .16);
      font-size: 2.4rem;
      font-style: normal;
      z-index: 4;
    }

    .card.situation-everyday .situation-icon {
      color: var(--good);
      border-color: var(--good);
      box-shadow: 0 0 0 4px rgba(33, 122, 67, .18), 0 14px 32px rgba(31, 41, 51, .16);
    }

    .card.situation-formal .situation-icon {
      color: var(--bad);
      border-color: #7f1d1d;
      box-shadow: 0 0 0 4px rgba(127, 29, 29, .18), 0 14px 32px rgba(31, 41, 51, .16);
    }

    .situation-icon.fa-face-laugh::before {
      content: "\1F642";
      display: block;
      line-height: 1;
    }

    .situation-icon.fa-briefcase::before {
      content: "\1F4BC";
      display: block;
      line-height: 1;
      transform: translateY(-3px);
    }

    .progress {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: -0.03em;
      color: var(--accent);
    }

    .hint-row {
      position: absolute;
      top: -16px;
      left: 30px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      max-width: calc(100% - 112px);
    }

    .style-hint,
    .meaning-hint {
      color: var(--accent);
      background: #fff;
      border: 1px solid rgba(31, 41, 51, .12);
      border-radius: 999px;
      box-shadow: 0 10px 24px rgba(31, 41, 51, .12);
      padding: .38rem .8rem;
      font-weight: 850;
      font-size: clamp(1rem, 1.65vw, 1.22rem);
      letter-spacing: .02em;
      text-transform: uppercase;
    }

    .meaning-hint {
      color: #3f4a54;
      border-color: rgba(31, 41, 51, .16);
      font-size: clamp(.84rem, 1.25vw, 1rem);
      letter-spacing: .01em;
      text-transform: none;
    }

    .style-hint:empty,
    .meaning-hint:empty {
      display: none;
    }

    .card.situation-everyday .style-hint {
      color: var(--good);
      border-color: rgba(77, 148, 91, .35);
    }

    .card.situation-formal .style-hint {
      color: var(--bad);
      border-color: rgba(163, 58, 43, .32);
    }

    .sentence {
      font-size: clamp(1.22rem, 2.6vw, 2rem);
      line-height: 1.22;
      letter-spacing: -0.045em;
      margin: 0;
      font-weight: 750;
    }

    .blank-wrap {
      display: inline-flex;
      vertical-align: baseline;
      min-width: min(100%, 190px);
      margin: 0 .1em;
      position: relative;
      top: -5px;
    }

    .custom-select-wrapper {
      position: relative;
      display: inline-block;
      width: 100%;
      user-select: none;
    }

    .custom-select-trigger {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: .7em;
      font: inherit;
      font-size: clamp(.95rem, 1.55vw, 1.15rem);
      font-weight: 750;
      line-height: 1.1;
      padding: .35em .6em .35em .75em;
      border: 2px solid var(--accent);
      border-radius: 999px;
      background: white;
      color: var(--ink);
      outline: none;
      cursor: pointer;
      transition: border-color .18s ease, background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .custom-select-trigger:hover,
    .custom-select-wrapper.open .custom-select-trigger,
    .custom-select-trigger:focus-visible {
      box-shadow: 0 0 0 4px rgba(50, 76, 95, .16);
    }

    .custom-select-label.placeholder {
      color: var(--ink);
    }

    .chevron {
      width: 1em;
      height: 1em;
      flex: 0 0 auto;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform .18s ease;
    }

    .custom-select-wrapper.open .chevron {
      transform: rotate(180deg);
    }

/* Dropdown-containern – bredd och padding anpassad så texten får plats */
.custom-select-dropdown {
  display: block; /* Styrs via opacity/pointer-events för hårdvaruaccelererad animation utan lagg */
  opacity: 0;
  transform: translateY(4px) scale(0.99);
  pointer-events: none;
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: max(100%, 480px);
  background: #ffffff;
  border: 1px solid rgba(219, 211, 199, 0.6);
  border-radius: 20px;
  z-index: 50;
  padding: 12px;
  box-shadow: 
    0 4px 6px -1px rgba(31, 41, 51, 0.05),
    0 20px 40px -2px rgba(31, 41, 51, 0.12);
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.custom-select-wrapper.multi-answer .custom-select-dropdown {
  width: max(100%, 620px);
}
/* Visas när dropdownen är öppen */
.custom-select-wrapper.open .custom-select-dropdown {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}
/* Tre kolumner med fyra svarsalternativ i varje när listan har tolv val */
.dropdown-cols-2-r5 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  grid-auto-flow: column;
  grid-template-rows: repeat(4, auto);
  gap: 8px;
}

.custom-select-wrapper.multi-answer .dropdown-cols-2-r5 {
  grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(110px, .8fr);
}
/* Svarsalternativen – designade som eleganta, klickbara piller */
.dropdown-option {
  min-width: 0;
  padding: 10px 12px;
  border-radius: 12px;
  cursor: pointer;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 1.06rem;
  letter-spacing: -0.02em;
  line-height: 1.3;
  white-space: normal;
  background: rgba(31, 41, 51, 0.03);
  color: rgba(31, 41, 51, 0.65);
  transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
}

.dropdown-option::first-line {
  color: var(--ink);
}
 
/* Hover- och fokusläge */
.dropdown-option:hover,
.dropdown-option:focus-visible {
  background: var(--accent-light);
  color: var(--accent);
  transform: translateY(-1px);
  outline: none;
}
/* När man klickar/håller ner */
.dropdown-option:active {
  transform: translateY(0);
}
/* Valt alternativ – fylls helt med din mörka accentfärg */
.dropdown-option.selected {
  background: var(--accent);
  color: #ffffff !important;
}
/* Säkerställer att även förstalinjen blir vit i valt läge */
.dropdown-option.selected::first-line {
  color: #ffffff !important;
}

.custom-select-dropdown .dropdown-option[data-value="__EMPTY__"] {
  display: flex !important;
  align-items: center;
  justify-content: flex-start !important;
  text-align: left !important;
}

.custom-select-dropdown .dropdown-option[data-value="__EMPTY__"] i {
  display: inline-block;
  width: 1em;
  margin: 0 .35em 0 0;
  text-align: left;
}

.dropdown-option.found {
  background: var(--good-bg);
  color: var(--good);
  font-weight: 850;
}

.dropdown-option.found::first-line {
  color: var(--good) !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.dropdown-option.empty-option {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.15rem;
}

.custom-select-label .fa-check {
  font-size: 1em;
  line-height: 1;
  margin-right: .35em;
}

.fa-solid.fa-check::before {
  content: "\2713";
}

.dropdown-done {
  display: none;
  grid-column: 4;
  grid-row: 1;
  align-items: center;
  justify-content: center;
  min-width: 0;
  border: 0;
  border-radius: 12px;
  background: var(--accent);
  color: #ffffff;
  cursor: pointer;
  font: inherit;
  font-size: 1.02rem;
  font-weight: 850;
  letter-spacing: -0.01em;
  padding: 10px 12px;
  transition: background-color .15s ease, transform .1s ease;
}

.custom-select-wrapper.multi-answer .dropdown-done {
  display: flex;
}

.dropdown-done:hover,
.dropdown-done:focus-visible {
  background: #1f3648;
  outline: none;
  transform: translateY(-1px);
}

.dropdown-done:active {
  transform: translateY(0);
}

.feedback {
  min-height: 3.4rem;
  margin-top: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  width: 100%;
  font-size: clamp(1.25rem, 2.2vw, 1.65rem);
  line-height: 1.25;
  font-weight: 800;
  letter-spacing: -0.02em;
}

    .is-correct .custom-select-trigger {
      border-color: var(--good);
      background: var(--good-bg);
      transform: translateY(-1px);
    }

    .is-wrong .custom-select-trigger {
      border-color: var(--bad);
      background: var(--bad-bg);
      animation: shake .24s ease both;
    }

    .feedback.correct { color: var(--good); }
    .feedback.wrong { color: var(--bad); }

    .next-row {
      display: none;
      justify-content: center;
      margin-top: 18px;
    }

    .next-row.visible {
      display: flex;
    }

    .next-button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -0.01em;
      padding: .72rem 1.8rem;
      box-shadow: 0 12px 26px rgba(31, 41, 51, .18);
      transition: background-color .15s ease, transform .12s ease, box-shadow .15s ease;
    }

    .next-button:hover,
    .next-button:focus-visible {
      background: #1f3648;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(31, 41, 51, .22);
      outline: none;
    }

    .next-button:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(31, 41, 51, .18);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(16, 24, 40, .45);
      display: none;
      place-items: center;
      padding: 24px;
      z-index: 20;
    }

    .modal-backdrop.open { display: grid; }

    .modal {
      width: min(560px, 100%);
      background: #fffaf2;
      border-radius: 26px;
      box-shadow: 0 28px 70px rgba(0,0,0,.28);
      padding: 42px 34px 34px;
      position: relative;
      transform: translateY(12px) scale(.98);
      opacity: 0;
      animation: modalIn .22s ease forwards;
      border: 1px solid rgba(217, 207, 192, .95);
    }

    @keyframes modalIn {
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .modal h2 {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      letter-spacing: -0.04em;
    }

    .modal p {
      margin: 0;
      color: var(--ink);
      font-size: 1.15rem;
      line-height: 1.55;
    }


    .exercise-length-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 24px;
    }

    .exercise-length-options[hidden] {
      display: none;
    }

    .exercise-length-button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 1.02rem;
      font-weight: 850;
      letter-spacing: -0.01em;
      padding: .78rem 1.1rem;
      box-shadow: 0 12px 26px rgba(31, 41, 51, .16);
      transition: background-color .15s ease, transform .12s ease, box-shadow .15s ease;
    }

    .exercise-length-button:hover,
    .exercise-length-button:focus-visible {
      background: #1f3648;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(31, 41, 51, .2);
      outline: none;
    }

    .exercise-length-button:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(31, 41, 51, .16);
    }

    .completion-actions {
      display: flex;
      justify-content: center;
      margin-top: 28px;
    }

    .completion-actions[hidden] {
      display: none;
    }

    .restart-button {
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 850;
      letter-spacing: -0.01em;
      padding: .72rem 1.8rem;
      box-shadow: 0 12px 26px rgba(31, 41, 51, .18);
      transition: background-color .15s ease, transform .12s ease, box-shadow .15s ease;
    }

    .restart-button:hover,
    .restart-button:focus-visible {
      background: #1f3648;
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(31, 41, 51, .22);
      outline: none;
    }

    .restart-button:active {
      transform: translateY(0);
      box-shadow: 0 10px 22px rgba(31, 41, 51, .18);
    }

    .close {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--accent);
      font-size: 30px;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform .25s ease, background-color .2s ease, color .2s ease;
    }
	
.situation-icon.fa-pen-nib::before {
  content: "\270E";
  display: block;
  line-height: 1;
}

    .close:hover,
    .close:focus {
      background: var(--accent-light);
      color: #172631;
      transform: rotate(90deg) scale(1.08);
      outline: none;
    }

    @media (max-width: 640px) {
      body { padding: 22px 16px; }
      .page-header { flex-direction: column; gap: 8px; margin-bottom: 38px; }
      .card { border-radius: 22px; }
      .situation-icon { top: -24px; right: 20px; width: 54px; height: 54px; font-size: 1.9rem; }
      .hint-row { top: -13px; left: 20px; max-width: calc(100% - 86px); gap: 6px; }
      .style-hint { font-size: .92rem; }
      .meaning-hint { font-size: .78rem; }
      .blank-wrap { display: block; margin: .35em 0; min-width: 0; width: 100%; }
      .custom-select-wrapper { width: 100%; }
      .custom-select-dropdown { width: 100%; min-width: 0; }
      .custom-select-wrapper.multi-answer .custom-select-dropdown { width: 100%; }
      .custom-select-wrapper.multi-answer .dropdown-cols-2-r5 { grid-auto-flow: row; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: auto; }
      .custom-select-wrapper.multi-answer .dropdown-done { grid-column: 1 / -1; grid-row: auto; min-height: 48px; }
      .dropdown-option { font-size: .98rem; }
      .exercise-length-options { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="exercise-not-started">
  <main>
    <header class="page-header">
      <h1>Swedish Relative clauses</h1>
      <div class="progress" id="progress">0 / 0 points</div>
    </header>

    <section class="card" id="card" aria-live="polite">
      <i class="situation-icon fa-regular fa-face-laugh" id="situationIcon" aria-hidden="true"></i>
      <div class="hint-row" aria-live="polite">
        <span class="style-hint" id="styleHint"></span>
        <span class="meaning-hint" id="meaningHint"></span>
      </div>
      <p class="sentence" id="sentence"></p>
    </section>

    <div class="feedback" id="feedback" aria-live="assertive"></div>
    <div class="next-row" id="nextRow">
      <button type="button" class="next-button" id="nextButton">Next</button>
    </div>
  </main>

  <div class="modal-backdrop open" id="modalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle">Customise your practice</h2>
      <p id="modalText">Choose how many sentences your practice should contain!</p>
      <div class="exercise-length-options" id="exerciseLengthOptions" aria-label="Choose exercise length">
        <button type="button" class="exercise-length-button" data-count="15">15 sentences</button>
        <button type="button" class="exercise-length-button" data-count="30">30 sentences</button>
        <button type="button" class="exercise-length-button" data-count="50">50 sentences</button>
        <button type="button" class="exercise-length-button" data-count="100">100 sentences</button>
      </div>
      <div class="completion-actions" id="completionActions" hidden>
        <button type="button" class="restart-button" id="restartButton">Restart</button>
      </div>
    </section>
  </div>

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function acceptedValues(item) {
      return item.acceptedAnswers.map(answer => answer.value);
    }

function labelForValue(value) {
  if (value === '__EMPTY__') return 'omitted';
  return OPTIONS.find(option => option.value === value)?.label || value;
}

    function updateStats() {
      progressEl.textContent = `${state.score} / ${state.totalPoints} points`;
    }

    function optionLabelMarkup(option) {
      if (option.value === '__EMPTY__') {
        return '<i class="fa-solid fa-check" aria-hidden="true"></i><span>omitted</span>';
      }
      return escapeHtml(option.label);
    }

    function optionMarkup() {
      return OPTIONS.map(option => {
        const emptyClass = option.value === '__EMPTY__' ? ' empty-option' : '';
        return `<div class="dropdown-option${emptyClass}" role="option" aria-selected="false" tabindex="-1" data-value="${escapeHtml(option.value)}">${optionLabelMarkup(option)}</div>`;
      }).join('');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function correctFeedback(item, answerCount = 1) {
      if (item.section === '4 whole situation') {
        return 'Correct. Vilket refers to the whole previous clause or situation.';
      }
      if (item.situation === 'Semi-formal Swedish') {
        return answerCount > 1
          ? 'Correct. These are accepted semi-formal forms.'
          : 'Correct. This is the semi-formal form.';
      }
      if (item.situation === 'Formal Swedish') {
        return answerCount > 1
          ? 'Correct. These are accepted formal forms.'
          : 'Correct. This is the formal form.';
      }
      return answerCount > 1
        ? 'Correct. These are accepted neutral forms.'
        : 'Correct. This is the neutral form.';
    }

function answerFeedback(item, value) {
  if (value === '__EMPTY__') {
    return 'Correct. The relative marker can be omitted here.';
  }
  const storedFeedback = item.acceptedAnswers.find(answer => answer.value === value)?.feedback;
  return storedFeedback || correctFeedback(item, 1);
}

    function meaningHintForItem(item) {
      if (item.section === '5 location') return 'location';
      if (item.section === '6 direction to') return 'movement towards';
      if (item.section === '7 origin from') return 'movement from';
      if (item.section === '8 time') return 'time/period';
      if (item.section === '9 possession') return 'belonging / relation';
      if (item.section === '4 whole situation') return 'reference to everything before';
      return '';
    }

    function registerPromptKey(prompt) {
      return prompt.toLowerCase().replaceAll(',', '').replace(/\s+/g, ' ').trim();
    }

    function itemNumber(item) {
      return item.id.match(/_(\d+)$/)?.[1] || null;
    }

    function canCompareBySectionAndNumber(item, candidate) {
      const comparableSections = ['5 location', '6 direction to', '7 origin from', '8 time'];
      return comparableSections.includes(item.section) &&
        candidate.section === item.section &&
        itemNumber(candidate) &&
        itemNumber(candidate) === itemNumber(item);
    }

    function registerName(situation) {
      if (situation === 'Neutral Swedish' || situation === 'Everyday Swedish') return 'neutral Swedish';
      if (situation === 'Semi-formal Swedish') return 'semi-formal Swedish';
      if (situation === 'Formal Swedish') return 'formal Swedish';
      return situation.toLowerCase();
    }

    function betterRegisterContext(item, value) {
      const key = registerPromptKey(item.prompt);
      const counterpart = BANK.find(candidate =>
        candidate !== item &&
        candidate.situation !== item.situation &&
        acceptedValues(candidate).includes(value) &&
        (
          registerPromptKey(candidate.prompt) === key ||
          canCompareBySectionAndNumber(item, candidate)
        )
      );
      return counterpart?.situation || null;
    }

    function registerMismatchClause(item, values) {
      const groups = values.reduce((acc, value) => {
        const context = betterRegisterContext(item, value);
        if (!context) return acc;
        if (!acc[context]) acc[context] = [];
        acc[context].push(value);
        return acc;
      }, {});

      const clauses = Object.entries(groups).map(([context, groupedValues]) => {
        if (groupedValues.length === 1 && groupedValues[0] === '__EMPTY__') {
          return `Omitting the marker is grammatically correct in this example, but in terms of register, it is better suited to ${registerName(context)}`;
        }

        const subject = capitalizeFirst(quotedAnswerList(groupedValues));
        const verb = groupedValues.length === 1 ? 'is' : 'are';
        const pronoun = groupedValues.length === 1 ? 'it is' : 'they are';
        return `${subject} ${verb} grammatically correct in this example, but in terms of register, ${pronoun} better suited to ${registerName(context)}`;
      });

      if (clauses.length <= 1) return clauses[0] || '';
      return clauses.join('. ');
    }

    function alternativeCountText(count) {
      if (count === 1) return 'one alternative';
      if (count === 2) return 'two alternatives';
      return `${count} alternatives`;
    }

    function missedAlternativeCount(item, selectedValues, correctValues) {
      const correctSelectedCount = selectedValues.filter(value => correctValues.includes(value)).length;
      const registerCompatibleCount = selectedValues.filter(value =>
        !correctValues.includes(value) && betterRegisterContext(item, value)
      ).length;
      return Math.max(0, correctValues.length - correctSelectedCount - registerCompatibleCount);
    }

    function quotedAnswerList(values) {
      const labels = values.map(value => value === '__EMPTY__'
        ? 'omitting the marker'
        : `"${labelForValue(value)}"`
      );
      if (labels.length <= 1) return labels[0] || '';
      return `${labels.slice(0, -1).join(', ')} and ${labels[labels.length - 1]}`;
    }

    function capitalizeFirst(value) {
      if (!value) return '';
      return value.charAt(0).toUpperCase() + value.slice(1);
    }

    function isOrAre(count) {
      return count === 1 ? 'is' : 'are';
    }

    function sameAnswerSet(selectedValues, correctValues) {
      if (selectedValues.length !== correctValues.length) return false;
      return correctValues.every(value => selectedValues.includes(value));
    }

    function hideNextButton() {
      nextRowEl.classList.remove('visible');

    function showNextButton() {
      nextButtonEl.disabled = false;
      nextRowEl.classList.add('visible');

    function renderSentence(item) {
      const isMultiAnswer = item.acceptedAnswers.length > 1;
      const triggerLabel = isMultiAnswer ? 'Pick all' : 'Choose';
      const customSelect = `
        <span class="blank-wrap">
          <span class="custom-select-wrapper" id="answerSelectWrapper">
            <button type="button" class="custom-select-trigger" id="answerSelectTrigger" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose the relative-clause introducer">
              <span class="custom-select-label placeholder" id="answerSelectLabel">${triggerLabel}</span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
            </button>
            <span class="custom-select-dropdown" role="listbox" aria-label="Relative-clause introducer">
              <span class="dropdown-cols-2-r5" id="answerDropdownCols">
                ${optionMarkup()}
                <button type="button" class="dropdown-done" id="answerDone">I'm done</button>
              </span>
            </span>
          </span>
        </span>`;

      sentenceEl.innerHTML = escapeHtml(item.prompt).replace('___', customSelect);
      styleHintEl.textContent = item.situation;
      meaningHintEl.textContent = meaningHintForItem(item);
      feedbackEl.textContent = '';
      feedbackEl.className = 'feedback';
      hideNextButton();
cardEl.classList.remove(
  'is-correct',
  'is-wrong',
  'situation-everyday',
  'situation-semi-formal',
  'situation-formal'
);

if (item.situation === 'Formal Swedish') {
  cardEl.classList.add('situation-formal');
  situationIconEl.className = 'situation-icon fa-solid fa-briefcase';
} else if (item.situation === 'Semi-formal Swedish') {
  cardEl.classList.add('situation-semi-formal');
  situationIconEl.className = 'situation-icon fa-solid fa-pen-nib';
} else {
  cardEl.classList.add('situation-everyday');
  situationIconEl.className = 'situation-icon fa-regular fa-face-laugh';
}

      initAnswerSelect();
    }

    function closeAnswerSelect() {
      const wrapper = document.getElementById('answerSelectWrapper');
      const trigger = document.getElementById('answerSelectTrigger');
      if (!wrapper || !trigger) return;
      wrapper.classList.remove('open');
      trigger.setAttribute('aria-expanded', 'false');
    }

    function resetAnswerLabel(text = 'Choose') {
      const label = document.getElementById('answerSelectLabel');
      if (!label) return;
      label.textContent = text;
      label.classList.toggle('placeholder', text === 'Choose' || text === 'Choose another' || text === 'Pick all');
    }

    function markFoundOption(value) {
      const option = document.querySelector(`.dropdown-option[data-value="${CSS.escape(value)}"]`);
      if (option) option.classList.add('found');
    }

    function initAnswerSelect() {
      const wrapper = document.getElementById('answerSelectWrapper');
      const trigger = document.getElementById('answerSelectTrigger');
      const label = document.getElementById('answerSelectLabel');
      const doneButton = document.getElementById('answerDone');
      if (!wrapper || !trigger || !label) return;
      const isMultiAnswer = state.currentItem.acceptedAnswers.length > 1;
      wrapper.classList.toggle('multi-answer', isMultiAnswer);
      resetAnswerLabel(isMultiAnswer ? 'Pick all' : 'Choose');

      trigger.addEventListener('click', event => {
        event.stopPropagation();
        if (state.locked) return;
        const willOpen = !wrapper.classList.contains('open');
        wrapper.classList.toggle('open', willOpen);
        trigger.setAttribute('aria-expanded', String(willOpen));
      });

      wrapper.querySelector('.custom-select-dropdown').addEventListener('click', event => {
        event.stopPropagation();
      });

      wrapper.querySelectorAll('.dropdown-option').forEach(option => {
        option.addEventListener('click', () => {
          const selected = option.dataset.value;
          if (isMultiAnswer) {
            const isSelected = state.selectedAnswers.has(selected);
            if (isSelected) {
              state.selectedAnswers.delete(selected);
              option.classList.remove('selected');
              option.setAttribute('aria-selected', 'false');
            } else {
              state.selectedAnswers.add(selected);
              option.classList.add('selected');
              option.setAttribute('aria-selected', 'true');
            }
            cardEl.classList.remove('is-correct', 'is-wrong');
            feedbackEl.textContent = '';
            feedbackEl.className = 'feedback';
            return;
          }

          if (selected === '__EMPTY__') {
            label.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i><span>omitted</span>';
            label.setAttribute('aria-label', 'omitted relative marker');
          } else {
            label.textContent = labelForValue(selected);
            label.removeAttribute('aria-label');
          }
          label.classList.remove('placeholder');
          wrapper.querySelectorAll('.dropdown-option').forEach(item => item.classList.remove('selected'));
          option.classList.add('selected');
          closeAnswerSelect();
          handleAnswer(selected);
        });
      });

      if (doneButton) {
        doneButton.addEventListener('click', event => {
          event.stopPropagation();
          handleMultiAnswerSubmit();
        });
      }
    }

    function nextSentence() {
      state.locked = false;
      state.foundAnswers = new Set();
      state.selectedAnswers = new Set();
      if (state.remaining.length === 0) {
        updateStats();
        openCompletionModal();
        return;
      }
      state.currentItemIndex = state.remaining.shift();
      state.currentItem = BANK[state.currentItemIndex];
      renderSentence(state.currentItem);
      updateStats();
    }

    function handleAnswer(selected) {
      if (state.locked) return;
      const item = state.currentItem;
      const correctValues = acceptedValues(item);
      const isCorrect = correctValues.includes(selected);

      cardEl.classList.toggle('is-correct', isCorrect);
      cardEl.classList.toggle('is-wrong', !isCorrect);

      if (state.foundAnswers.has(selected)) {
        feedbackEl.textContent = `Already found: ${labelForValue(selected)}. Try another accepted answer.`;
        feedbackEl.className = 'feedback correct';
        setTimeout(() => cardEl.classList.remove('is-correct'), 320);
        resetAnswerLabel('Choose another');
        return;
      }

      if (isCorrect) {
        state.foundAnswers.add(selected);
        state.score += 1;
        markFoundOption(selected);
        state.locked = true;
        state.completed += 1;
        feedbackEl.textContent = answerFeedback(item, selected);
        feedbackEl.className = 'feedback correct';
        updateStats();
        showNextButton();
      } else {
        state.mistakes += 1;
        const registerMismatch = registerMismatchClause(item, [selected]);
        if (registerMismatch) {
          feedbackEl.textContent = `${registerMismatch}.`;
        } else if (selected === '__EMPTY__') {
          feedbackEl.textContent = 'Incorrect. The relative marker cannot be omitted here.';
        } else {
          feedbackEl.textContent = 'Incorrect. Try again.';
        }
        feedbackEl.className = 'feedback wrong';
        updateStats();
        setTimeout(() => cardEl.classList.remove('is-wrong'), 320);
      }
    }

    function handleMultiAnswerSubmit() {
      if (state.locked) return;
      const item = state.currentItem;
      const correctValues = acceptedValues(item);
      const selectedValues = [...state.selectedAnswers];
      closeAnswerSelect();

      if (selectedValues.length === 0) {
        cardEl.classList.add('is-wrong');
        feedbackEl.textContent = 'Choose at least one answer before you click I\'m done.';
        feedbackEl.className = 'feedback wrong';
        setTimeout(() => cardEl.classList.remove('is-wrong'), 320);
        return;
      }

      const isFullyCorrect = sameAnswerSet(selectedValues, correctValues);
      cardEl.classList.toggle('is-correct', isFullyCorrect);
      cardEl.classList.toggle('is-wrong', !isFullyCorrect);

      if (isFullyCorrect) {
        state.locked = true;
        state.completed += 1;
        state.score += correctValues.length;
        correctValues.forEach(markFoundOption);
        feedbackEl.textContent = correctFeedback(item, correctValues.length);
        feedbackEl.className = 'feedback correct';
        updateStats();
        showNextButton();
        return;
      }

      state.mistakes += 1;
      const correctSelected = selectedValues.filter(value => correctValues.includes(value)).length;
      const extraAnswers = selectedValues.filter(value => !correctValues.includes(value));
      const correctSelectedValues = selectedValues.filter(value => correctValues.includes(value));
      const missingCount = correctValues.filter(value => !selectedValues.includes(value)).length;
      const missingCountForFeedback = missedAlternativeCount(item, selectedValues, correctValues);
      const registerMismatch = registerMismatchClause(item, extraAnswers);
      const strictlyWrongAnswers = extraAnswers.filter(value => !betterRegisterContext(item, value));

      if (selectedValues.length === 1 && correctSelected === 1) {
        if (selectedValues[0] === '__EMPTY__') {
          feedbackEl.textContent = `Correct. The relative marker can be omitted here, but you have missed ${alternativeCountText(missingCount)}.`;
        } else {
          feedbackEl.textContent = `Correct, but you have missed ${alternativeCountText(missingCount)}.`;
        }
      } else if (selectedValues.length === 1 && registerMismatch) {
        feedbackEl.textContent = `${registerMismatch}.`;
        if (missingCountForFeedback > 0 && correctValues.length > 1) {
          feedbackEl.textContent += ` Also, you have missed ${alternativeCountText(missingCountForFeedback)}.`;
        }
      } else if (selectedValues.length === 1) {
        if (selectedValues[0] === '__EMPTY__') {
          feedbackEl.textContent = 'Incorrect. The relative marker cannot be omitted here. You have also missed that there are several accepted answers.';
        } else {
          feedbackEl.textContent = 'Incorrect, and you have missed that there are several accepted answers.';
        }
      } else if (extraAnswers.length === 0 && missingCount > 0) {
        feedbackEl.textContent = `Correct, but you have missed ${alternativeCountText(missingCount)}.`;
      } else if (correctSelectedValues.length > 0 && extraAnswers.length > 0) {
        feedbackEl.textContent = `${capitalizeFirst(quotedAnswerList(correctSelectedValues))} ${isOrAre(correctSelectedValues.length)} correct.`;
        if (registerMismatch) {
          feedbackEl.textContent += ` ${registerMismatch}.`;
        }
        if (strictlyWrongAnswers.length > 0) {
          feedbackEl.textContent += ` ${capitalizeFirst(quotedAnswerList(strictlyWrongAnswers))} ${isOrAre(strictlyWrongAnswers.length)} incorrect.`;
        }
        if (missingCountForFeedback > 0) {
          feedbackEl.textContent += ` Also, you have missed ${alternativeCountText(missingCountForFeedback)}.`;
        }
      } else if (registerMismatch) {
        feedbackEl.textContent = `${registerMismatch}.`;
        if (strictlyWrongAnswers.length > 0) {
          feedbackEl.textContent += ` ${capitalizeFirst(quotedAnswerList(strictlyWrongAnswers))} ${isOrAre(strictlyWrongAnswers.length)} incorrect.`;
        }
        if (missingCountForFeedback > 0 && correctValues.length > 1) {
          feedbackEl.textContent += ` Also, you have missed ${alternativeCountText(missingCountForFeedback)}.`;
        }
      } else if (missingCount > 0) {
        feedbackEl.textContent = 'Incorrect, and you have missed that there are several accepted answers.';
      } else {
        feedbackEl.textContent = 'Incorrect. Try again.';
      }
      feedbackEl.className = 'feedback wrong';
      updateStats();
      setTimeout(() => cardEl.classList.remove('is-wrong'), 320);
    }

    function openSetupModal() {
      modalTitle.textContent = 'Customise your practice';
      modalText.textContent = 'Choose how many sentences your practice should contain!';
      exerciseLengthOptions.hidden = false;
      if (completionActions) completionActions.hidden = true;
      if (closeModal) closeModal.hidden = true;
      modalBackdrop.classList.add('open');
      const firstLengthButton = exerciseLengthOptions.querySelector('.exercise-length-button');
      if (firstLengthButton) firstLengthButton.focus();
    }

    function openCompletionModal() {
      modalTitle.textContent = 'Finished';
      modalText.textContent = `You scored ${state.score} out of ${state.totalPoints} possible points across ${state.totalSentences} practice sentences, with ${state.mistakes} ${state.mistakes === 1 ? 'mistake' : 'mistakes'}.`;
      exerciseLengthOptions.hidden = true;
      if (completionActions) completionActions.hidden = false;
      if (closeModal) closeModal.hidden = false;
      modalBackdrop.classList.add('open');
      if (restartButton) {
        restartButton.focus();
      } else if (closeModal) {
        closeModal.focus();
      } else {
        modalTitle.setAttribute('tabindex', '-1');
        modalTitle.focus();
      }
    }

    function closeModalFn() {
      modalBackdrop.classList.remove('open');
    }

    function startExercise(sentenceCount) {
      const selectedIndices = shuffle([...BANK.keys()]).slice(0, sentenceCount);
      state.remaining = selectedIndices;
      state.currentItemIndex = null;
      state.currentItem = null;
      state.foundAnswers = new Set();
      state.selectedAnswers = new Set();
      state.completed = 0;
      state.score = 0;
      state.mistakes = 0;
      state.locked = false;
      state.started = true;
      state.totalSentences = selectedIndices.length;
      state.totalPoints = selectedIndices.reduce((sum, index) => sum + BANK[index].maxScore, 0);
      if (completionActions) completionActions.hidden = true;
      document.body.classList.remove('exercise-not-started');
      closeModalFn();
      nextSentence();
    }

    nextButtonEl.addEventListener('click', nextSentence);

    if (restartButton) {
      restartButton.addEventListener('click', () => {
        window.location.reload();
      });
    }

    exerciseLengthOptions.querySelectorAll('.exercise-length-button').forEach(button => {
      button.addEventListener('click', () => startExercise(Number(button.dataset.count)));
    });

    document.addEventListener('click', closeAnswerSelect);

    if (closeModal) {
      closeModal.addEventListener('click', () => {
        if (state.started) closeModalFn();
      });
    }
    modalBackdrop.addEventListener('click', event => {
      if (event.target === modalBackdrop && state.started) closeModalFn();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeAnswerSelect();
        if (state.started && modalBackdrop.classList.contains('open')) closeModalFn();
      }
    });

    openSetupModal();
  </script>
</body>
</html>
