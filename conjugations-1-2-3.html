<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verb Practice - Sentences</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --line: #e2e8f0;
      --accent: #0f766e;
      --accent-hover: #0d9488;
      --good: #16a34a;
      --bad: #dc2626;
      --focus: #ccfbf1;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.04);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(950px, calc(100% - 32px));
      margin: 40px auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    /* Filterkontroll */
    .filter-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .filter-label {
      font-size: 16px;
      font-weight: 700;
      color: #334155;
    }

    .filter-select {
      appearance: none;
      background-color: var(--panel);
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%3c475569' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 10px 42px 10px 16px;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #0f172a;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
      outline: none;
    }

    .filter-select:hover {
      border-color: #cbd5e1;
      box-shadow: var(--shadow-md);
    }

    .filter-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .sentences-panel {
      background: transparent;
    }

    .sentences-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* Större och luftigare kort för varje rad */
    .sentence-item {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 20px 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }

    .sentence-item:hover {
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
      transform: translateY(-2px);
    }

    .sentence-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      font-weight: 700;
      font-size: 15px;
      flex-shrink: 0;
    }

    .flags-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-right: 12px;
      border-right: 1px solid var(--line);
    }

    /* Uppskalat typsnitt för exempelmeningarna */
    .sentence-text {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 500;
      color: #1e293b;
      white-space: nowrap;
    }

    /* Större flagg-ikoner */
    .flag-trigger {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      cursor: help;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    .flag-trigger:hover,
    .flag-trigger:focus {
      transform: scale(1.25);
      outline: none;
    }

    .flag-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      border-radius: 50%;
      box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
    }

    /* Tooltip */
    .flag-tooltip {
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #0f172a;
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      box-shadow: var(--shadow-md);
      transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
      z-index: 20;
    }

    .flag-tooltip::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px;
      border-style: solid;
      border-color: #0f172a transparent transparent transparent;
    }

    .flag-trigger:hover .flag-tooltip,
    .flag-trigger:focus .flag-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Input wrapper för att rymma de större knapparna */
    .input-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .char-buttons {
      position: absolute;
      left: 6px;
      display: flex;
      gap: 4px;
      z-index: 2;
    }

    /* Större å/ä/ö-knappar med tydligare typsnitt */
    .char-btn {
      border: 0;
      background: #e2e8f0;
      color: #334155;
      font: inherit;
      font-size: 15px;
      font-weight: 700;
      width: 27px;
      height: 29px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: background 0.15s ease, color 0.15s ease;
      user-select: none;
    }

    .char-btn:hover {
      background: #cbd5e1;
      color: #0f172a;
    }

    .char-btn:active {
      background: #94a3b8;
      color: #ffffff;
    }

    /* Större textinput-fält anpassat efter den uppskalade textstorleken */
    .verb-input {
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      padding: 8px 14px 8px 104px; /* Ökat vänsteravstånd för knapparna */
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      width: 250px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.15s ease;
    }

    .verb-input:focus {
      background: #ffffff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--focus);
    }

    .verb-input.correct {
      border-color: var(--good) !important;
      background: #f0fdf4 !important;
      color: #14532d !important;
    }

    .verb-input.incorrect {
      border-color: var(--bad) !important;
      background: #fef2f2 !important;
      color: #7f1d1d !important;
    }

    /* Knappar och resultat */
    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 36px;
      padding: 0 4px;
    }

    .actions button {
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 12px 24px;
      box-shadow: var(--shadow-sm);
      transition: all 0.15s ease;
    }

    .actions button:hover {
      background: var(--accent-hover);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    #result {
      color: var(--muted);
      font-weight: 700;
      font-size: 16px;
    }

    @media (max-width: 680px) {
      main {
        width: calc(100% - 24px);
        margin: 24px auto;
      }

      .sentence-item {
        overflow-x: auto;
      }
    }
  </style>
</head>

      { infinitive: "uppnå", tense: "supine", before: "Vi har", after: "resultatet.", translation: "We have achieved the result." },
      { infinitive: "bry sig", tense: "present", before: "Hon", after: "sig om miljön.", translation: "She cares about the environment." },
      { infinitive: "bry sig", tense: "supine", before: "De har", after: "om frågan.", translation: "They have cared about the issue." },
      { infinitive: "fly", tense: "past", before: "Familjen", after: "från kriget.", translation: "The family fled from the war." },
      { infinitive: "fly", tense: "present", before: "Människorna", after: "söderut.", translation: "The people flee south." },
      { infinitive: "bete sig", tense: "past", before: "Barnet", after: "lugnt.", translation: "The child behaved calmly." },
      { infinitive: "bete sig", tense: "supine", before: "Han har", after: "illa.", translation: "He has behaved badly." }
    ];

    const englishIconUrl = "https://cdn-icons-png.flaticon.com/512/197/197374.png";
    const swedishIconUrl = "https://cdn-icons-png.flaticon.com/512/197/197564.png";

    // Slumpningsfunktion (Fisher-Yates)
    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function renderExercise() {
      const container = document.querySelector("#sentences-container");
      const selectedGroup = document.querySelector("#conjugation-filter").value;

      const filteredPrompts = prompts.filter(p => {
        if (selectedGroup === "all") return true;
        return verbForms[p.infinitive].group === selectedGroup;
      });

      // Tvinga fram en helt ny slumpmässig ordning vid varje rendering
      const shuffledPrompts = shuffle(filteredPrompts);

      container.innerHTML = shuffledPrompts.map((p, index) => {
        const correctForm = verbForms[p.infinitive][p.tense];
        
        return `
          <li class="sentence-item">
            <span class="sentence-number">${index + 1}</span>
            <div class="flags-group">
              <div class="flag-trigger" tabindex="0" aria-label="Svenskt verb i infinitiv">
                <img src="${swedishIconUrl}" alt="Sweden Flag Icon" class="flag-img">
                <div class="flag-tooltip" role="tooltip">${p.infinitive}</div>
              </div>
              <div class="flag-trigger" tabindex="0" aria-label="Engelsk översättning">
                <img src="${englishIconUrl}" alt="UK Flag Icon" class="flag-img">
                <div class="flag-tooltip" role="tooltip">${p.translation}</div>
              </div>
            </div>
            <div class="sentence-text">
              <span>${p.before}</span>
              <div class="input-wrapper">
                <div class="char-buttons">
                  <button type="button" class="char-btn" data-char="å">å</button>
                  <button type="button" class="char-btn" data-char="ä">ä</button>
                  <button type="button" class="char-btn" data-char="ö">ö</button>
                </div>
                <input type="text" 
                       class="verb-input" 
                       data-correct="${correctForm}" 
                       autocomplete="off" 
                       spellcheck="false">
              </div>
              <span>${p.after}</span>
            </div>
          </li>
        `;
      }).join("");

      updateResult();
    }

    function insertCharIntoInput(input, char) {
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const text = input.value;

      input.value = text.slice(0, start) + char + text.slice(end);
      const newPos = start + char.length;
      input.setSelectionRange(newPos, newPos);
      input.focus();

      gradeInput(input);
      updateResult();
    }

    function gradeInput(input) {
      const val = input.value.trim().toLowerCase();
      const correct = input.dataset.correct.toLowerCase();

      if (val === "") {
        input.classList.remove("correct", "incorrect");
        return null;
      }

      if (val === correct) {
        input.classList.add("correct");
        input.classList.remove("incorrect");
        return true;
      } else {
        input.classList.add("incorrect");
        input.classList.remove("correct");
        return false;
      }
    }

    function updateResult() {
      const inputs = Array.from(document.querySelectorAll(".verb-input"));
      const answered = inputs.filter(i => i.value.trim() !== "");
      const correct = answered.filter(i => gradeInput(i) === true).length;

      const resultText = document.querySelector("#result");
      if (answered.length === 0) {
        resultText.textContent = "";
      } else {
        resultText.textContent = `${correct} av ${answered.length} rätt besvarade`;
      }
    }

    document.querySelector("#sentences-container").addEventListener("click", (e) => {
      const charBtn = e.target.closest(".char-btn");
      if (charBtn) {
        const wrapper = charBtn.closest(".input-wrapper");
        const input = wrapper.querySelector(".verb-input");
        const char = charBtn.dataset.char;
        insertCharIntoInput(input, char);
      }
    });

    document.querySelector("#sentences-container").addEventListener("input", (e) => {
      if (e.target.matches(".verb-input")) {
        gradeInput(e.target);
        updateResult();
      }
    });

    document.querySelector("#conjugation-filter").addEventListener("change", renderExercise);
    document.querySelector("#reset").addEventListener("click", renderExercise);

    renderExercise();
  </script>
</body>
</html>
