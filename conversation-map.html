    @media(max-width:720px){.path-options{grid-template-columns:1fr}.path-card{padding-left:50px}.weekday-row{gap:3px}.weekday-row .phrase{padding:6px 3px;font-size:.62rem}.weekday-row .blank{width:12px}.activity-grid{gap:4px}.activity-grid .phrase{font-size:.72rem}.connector-row{gap:4px}.connector-row .phrase{min-width:82px;padding:7px 5px;font-size:.72rem}}

<body>
  <a class="skip" href="#main">Hoppa till innehållet</a>
  <header class="top shell">
    <div class="toprow"><div><p class="eyebrow" id="eyebrowText">Samtalskarta</p><h1 id="mainTitle">Dåtid och framtid</h1><p class="subtitle" id="subtitleText">Berätta om det som har hänt och det som ska hända</p></div>
      <div class="controls" aria-label="Visningsinställningar">
        <label><span class="sr-only">Översättningsspråk</span><select id="language" class="control" aria-label="Välj översättningsspråk"><option value="en">English</option><option value="de">Deutsch</option><option value="nl">Nederlands</option></select></label>
        <button id="toggleTranslations" class="control" type="button"></button>
      </div>
    </div>
  </header>
  <main id="main" class="shell">
    <div class="perspective-tabs" role="tablist" aria-label="Välj tidsperspektiv">
      <button id="pastTab" class="perspective-tab" type="button" role="tab" aria-selected="true" aria-controls="pastPanel" tabindex="0" data-perspective="past"><span aria-hidden="true">←</span>Blicka bakåt</button>
      <span class="tabs-now" aria-hidden="true">NU</span>
      <button id="futureTab" class="perspective-tab" type="button" role="tab" aria-selected="false" aria-controls="futurePanel" tabindex="-1" data-perspective="future">Blicka framåt<span aria-hidden="true">→</span></button>
    </div>
    <div class="perspective-panels"><section id="pastPanel" class="time-panel past" role="tabpanel" aria-labelledby="pastTab"></section><section id="futurePanel" class="time-panel future" role="tabpanel" aria-labelledby="futureTab" hidden></section></div>
  </main>
  <footer class="footer">Samtalsstöd för svenska</footer>
  <script>
  'use strict';
  const T=(sv,en,de,nl,level='basic')=>({sv,en,de,nl,level});
  const P=(sv,preterite,example,en,de,nl,level='basic')=>({sv,preterite,example,en,de,nl,level});
  const O=text=>text.includes('…')?text:`${text} …`;
  const F=(sv,en,de,dePlan,nl,nlPlan,level='basic')=>({level,futureForms:[
    {sv:O(`På fredag ska jag ${sv}`),en:O(`On Friday I will ${en}`),de:O(`Am Freitag werde ich ${de}`),nl:O(`Vrijdag ga ik ${nl}`)},
    {sv:O(`Jag tänker ${sv}`),en:O(`I plan to ${en}`),de:O(`Ich habe vor, ${dePlan}`),nl:O(`Ik ben van plan om ${nlPlan}`)},
    {sv:O(`Imorgon måste jag ${sv}`),en:O(`Tomorrow I have to ${en}`),de:O(`Morgen muss ich ${de}`),nl:O(`Morgen moet ik ${nl}`)}
  ]});
  const content={
    interfaceText:{
      mainTitle:{en:'Past and future',de:'Vergangenheit und Zukunft',nl:'Verleden en toekomst'},
      subtitle:{en:'Talk about what has happened and what is going to happen',de:'Erzähle, was passiert ist und was geschehen wird',nl:'Vertel wat er is gebeurd en wat er gaat gebeuren'},
      hide:{sv:'Dölj översättningar',en:'Hide translations',de:'Übersetzungen ausblenden',nl:'Vertalingen verbergen'},show:{sv:'Visa översättningar',en:'Show translations',de:'Übersetzungen anzeigen',nl:'Vertalingen tonen'},newQuestion:{sv:'Ny fråga',en:'New question',de:'Neue Frage',nl:'Nieuwe vraag'},
      tenseLabels:{
        en:{perfect:'Perfect',past:'Past tense',inverted:"Inverted word order when the subject doesn't go first"},
        de:{perfect:'Perfekt',past:'Präteritum',inverted:'Invertierte Wortstellung, wenn das Subjekt nicht an erster Stelle steht'},
        nl:{perfect:'Voltooide tijd',past:'Verleden tijd',inverted:'Omgekeerde woordvolgorde wanneer het onderwerp niet vooraan staat'}
      },
      futureLabels:{
        en:['ska (will)','tänker (plan to)','måste (have to)'],
        de:['ska (werden)','tänker (vorhaben)','måste (müssen)'],
        nl:['ska (gaan/zullen)','tänker (van plan zijn)','måste (moeten)']
      },
      paths:{
        heading:T('Välj hur meningen ska börja','Choose how to begin the sentence','Wähle, wie der Satz beginnen soll','Kies hoe de zin begint'),
        intro:T('Du kan börja med subjektet eller med ett tidsuttryck. Ordföljden blir olika.','You can begin with the subject or with a time expression. The word order changes.','Du kannst mit dem Subjekt oder mit einer Zeitangabe beginnen. Die Wortstellung ändert sich.','Je kunt met het onderwerp of met een tijdsbepaling beginnen. De woordvolgorde verandert.'),
        subjectTitle:T('Metod A: Subjekt först','Method A: Subject start','Methode A: Subjekt am Satzanfang','Methode A: Onderwerp vooraan'),
        subjectRule:T('Subjekt + verb + resten + tidsuttryck','Subject + verb + the rest + time expression','Subjekt + Verb + Rest + Zeitangabe','Onderwerp + werkwoord + rest + tijdsbepaling'),
        subjectHint:T('När subjektet står först kommer tidsuttrycket normalt sist.','When the subject comes first, the time expression normally comes last.','Wenn das Subjekt zuerst steht, kommt die Zeitangabe normalerweise zuletzt.','Als het onderwerp vooraan staat, komt de tijdsbepaling normaal gesproken achteraan.'),
        timeTitle:T('Metod B: Tidsuttryck först','Method B: Time reference start','Methode B: Zeitangabe am Satzanfang','Methode B: Tijdsbepaling vooraan'),
        timeRule:T('Tidsuttryck + verb + subjekt + resten','Time expression + verb + subject + the rest','Zeitangabe + Verb + Subjekt + Rest','Tijdsbepaling + werkwoord + onderwerp + rest'),
        timeHint:T('När tidsuttrycket står först kommer verbet direkt efter och därefter subjektet.','When the time expression comes first, the verb follows immediately and then the subject.','Wenn die Zeitangabe zuerst steht, folgt direkt das Verb und danach das Subjekt.','Als de tijdsbepaling vooraan staat, volgt direct het werkwoord en daarna het onderwerp.'),
        pastSubject:T('Jag arbetade igår.','I worked yesterday.','Ich arbeitete gestern.','Ik werkte gisteren.'),
        pastTime:T('Igår arbetade jag.','Yesterday I worked.','Gestern arbeitete ich.','Gisteren werkte ik.'),
        futureSubject:T('Jag ska jobba i helgen.','I will work at the weekend.','Ich werde am Wochenende arbeiten.','Ik ga dit weekend werken.'),
        futureTime:T('I helgen ska jag jobba.','At the weekend I will work.','Am Wochenende werde ich arbeiten.','Dit weekend ga ik werken.')
      },

  pastStarter.items=pastStarter.items.filter(item=>!pastWeekdays.some(day=>day.sv===item.sv));
  futureStarter.items=futureStarter.items.filter(item=>!futureWeekdays.some(day=>day.sv===item.sv));
  pastStarter.items.splice(4,0,...pastWeekdays);
  futureStarter.items.splice(6,0,...futureWeekdays);
  const insertAfter=(items,anchor,item)=>{const index=items.findIndex(entry=>entry.sv===anchor);items.splice(index+1,0,item)};
  insertAfter(pastStarter.items,'Den här veckan …',T('Tidigare i veckan …','Earlier this week …','Früher in der Woche …','Eerder deze week …'));
  insertAfter(pastStarter.items,'Igår …',T('I förrgår …','The day before yesterday …','Vorgestern …','Eergisteren …'));
  insertAfter(futureStarter.items,'I morgon …',T('I övermorgon …','The day after tomorrow …','Übermorgen …','Overmorgen …'));
  pastStarter.items=pastStarter.items.filter(item=>item.sv!=='Den här veckan …');
  pastStarter.items.push(T('Idag …','Today …','Heute …','Vandaag …'));
  const pastOrder=['Idag …','Igår …','I förrgår …','Tidigare i veckan …','I helgen …','Förra helgen …','Förra veckan …'];
  pastStarter.items.sort((a,b)=>{const ai=pastOrder.indexOf(a.sv),bi=pastOrder.indexOf(b.sv);return (ai<0?99:ai)-(bi<0?99:bi)});
  const addedSequenceTerms=[
    T('därefter','after that','danach','daarna'),
    T('innan dess','before that','davor','daarvoor'),
    T('under tiden','meanwhile','währenddessen','ondertussen')
  ];
  addedSequenceTerms.forEach(item=>item.sequenceAdded=true);
  const replacedSequenceTerms=['därefter','innan dess','efter det','efteråt','under tiden','så småningom'];
  ['past','future'].forEach(key=>{
    const connector=content[key].groups.find(group=>group.kind==='connector');
    connector.items=connector.items.filter(item=>!replacedSequenceTerms.includes(item.sv));
    const afterThen=connector.items.findIndex(item=>item.sv==='sedan')+1;
    connector.items.splice(afterThen,0,...addedSequenceTerms.map(item=>({...item})));
  });
  const futureConnector=content.future.groups.find(group=>group.kind==='connector');
  futureConnector.items=futureConnector.items.filter(item=>!['efter jobbet','under helgen'].includes(item.sv));
  const pastConnector=content.past.groups.find(group=>group.kind==='connector');
  pastConnector.items.find(item=>item.sv==='på morgonen').level='basic';
  const pastEvaluation=content.past.groups.find(group=>group.kind==='evaluation');
  pastEvaluation.items=pastEvaluation.items.filter(item=>!['därför att …','så …','men …'].includes(item.sv));
  pastEvaluation.items.push(
    T('Det var spännande.','It was exciting.','Es war spannend.','Het was spannend.'),
    T('Det var svårt.','It was difficult.','Es war schwierig.','Het was moeilijk.'),
    T('Det var lätt.','It was easy.','Es war einfach.','Het was gemakkelijk.')
  );
  content.future.groups.push({kind:'expectation',items:[
    T('Jag tror att det blir roligt.','I think it will be fun.','Ich glaube, es wird Spaß machen.','Ik denk dat het leuk wordt.'),
    T('Jag tror att det blir trevligt.','I think it will be lovely.','Ich glaube, es wird schön.','Ik denk dat het gezellig wordt.'),
    T('Jag tror att det blir intressant.','I think it will be interesting.','Ich glaube, es wird interessant.','Ik denk dat het interessant wordt.'),
    T('Jag tror att det blir jobbigt.','I think it will be hard work.','Ich glaube, es wird anstrengend.','Ik denk dat het zwaar wordt.'),
    T('Jag tror att det blir stressigt.','I think it will be stressful.','Ich glaube, es wird stressig.','Ik denk dat het stressvol wordt.','advanced'),
    T('Jag tror att det blir spännande.','I think it will be exciting.','Ich glaube, es wird spannend.','Ik denk dat het spannend wordt.'),
    T('Jag tror att det blir svårt.','I think it will be difficult.','Ich glaube, es wird schwierig.','Ik denk dat het moeilijk wordt.'),
    T('Jag tror att det blir lätt.','I think it will be easy.','Ich glaube, es wird einfach.','Ik denk dat het gemakkelijk wordt.'),
    T('Det blir nog bra.','It will probably be fine.','Es wird wahrscheinlich gut.','Het komt waarschijnlijk wel goed.'),
    T('Jag ser fram emot det.','I am looking forward to it.','Ich freue mich darauf.','Ik kijk ernaar uit.'),
    T('Jag är lite nervös.','I am a little nervous.','Ich bin etwas nervös.','Ik ben een beetje zenuwachtig.','advanced'),
    T('Jag vet inte hur det blir.','I do not know what it will be like.','Ich weiß nicht, wie es sein wird.','Ik weet niet hoe het zal zijn.','advanced')
  ]});
  const state={lang:'en',translations:localStorage.getItem('conversation-translations')!=='hidden',view:'basic',perspective:'past'};
  const icon=(direction)=>`<svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M${direction==='past'?'20 12H5m0 0 5-5m-5 5 5 5':'4 12h15m0 0-5-5m5 5-5 5'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const translated=item=>`<span class="translation" lang="${state.lang}">${item[state.lang]}</span>`;
  const fillBlank=text=>`<span>${text.replace(' …','')}</span>${text.includes('…')?'<span class="blank" aria-hidden="true"></span>':''}`;
  const highlightExample=text=>{const words=text.split(' ');return `<span class="time-first">${words.slice(0,text.startsWith('Förra veckan')?2:text.startsWith('I ')?2:1).join(' ')}</span> ${words.slice(text.startsWith('Förra veckan')||text.startsWith('I ')?2:1).map((word,index)=>index===0?`<span class="finite-verb">${word}</span>`:word).join(' ')}`};
  const tenseLabels=()=>content.interfaceText.tenseLabels[state.lang];
  const futureLabels=()=>content.interfaceText.futureLabels[state.lang];
  const phrase=(item,kind)=>item.futureForms
    ?`<div class="phrase future-form-card ${item.level==='advanced'?'advanced':''}" data-level="${item.level}">${item.futureForms.map((form,index)=>`<div class="future-form-row"><span class="tense-label">${futureLabels()[index]}</span>${fillBlank(form.sv)}${translated(form)}</div>`).join('')}</div>`
    :item.preterite
      ?`<div class="phrase tense-card ${item.level==='advanced'?'advanced':''}" data-level="${item.level}"><div class="tense-row"><span class="tense-label">${tenseLabels().perfect}</span>${fillBlank(item.sv)}</div><div class="tense-row preterite"><span class="tense-label">${tenseLabels().past}</span>${fillBlank(item.preterite)}</div><div class="tense-example"><span class="tense-label">${tenseLabels().inverted}</span>${highlightExample(item.example)}</div>${translated(item)}</div>`
      :`<div class="phrase ${kind==='connector'?'connector ':''}${item.level==='advanced'?'advanced':''}" data-level="${item.level}">${fillBlank(item.sv)}${translated(item)}</div>`;
  function renderPathways(key){const p=content.interfaceText.paths,isPast=key==='past',subjectExample=isPast?p.pastSubject:p.futureSubject,timeExample=isPast?p.pastTime:p.futureTime;const subjectSv=isPast?'<span class="subject-word">Jag</span> <span class="route-verb">arbetade</span> <span class="route-time">igår</span>.':'<span class="subject-word">Jag</span> <span class="route-verb">ska</span> jobba <span class="route-time">i helgen</span>.';const timeSv=isPast?'<span class="route-time">Igår</span> <span class="route-verb">arbetade</span> <span class="subject-word">jag</span>.':'<span class="route-time">I helgen</span> <span class="route-verb">ska</span> <span class="subject-word">jag</span> jobba.';return `<section class="sentence-paths" aria-labelledby="${key}PathsTitle"><h3 id="${key}PathsTitle" lang="${state.lang}">${p.heading[state.lang]}</h3><p class="paths-intro" lang="${state.lang}">${p.intro[state.lang]}</p><div class="path-options"><article class="path-card"><span class="path-number">A</span><h4 lang="${state.lang}">${p.subjectTitle[state.lang]}</h4><div class="path-rule" lang="${state.lang}">${p.subjectRule[state.lang]}</div><span class="path-hint" lang="${state.lang}">${p.subjectHint[state.lang]}</span><div class="path-example"><span lang="sv">${subjectSv}</span>${translated(subjectExample)}</div></article><article class="path-card"><span class="path-number">B</span><h4 lang="${state.lang}">${p.timeTitle[state.lang]}</h4><div class="path-rule" lang="${state.lang}">${p.timeRule[state.lang]}</div><span class="path-hint" lang="${state.lang}">${p.timeHint[state.lang]}</span><div class="path-example"><span lang="sv">${timeSv}</span>${translated(timeExample)}</div></article></div></section>`}
  const groupTitle=(key,kind)=>content.interfaceText.groupTitles[key][kind][state.lang];
  function renderPanel(key){
    const d=content[key],labels=content.interfaceText.uiLabels;
    const groups=d.groups.map(g=>{
      const heading=`<h3 lang="${state.lang}">${groupTitle(key,g.kind)}</h3>`;
      if(g.kind==='starter'){
        const regular=g.items.filter(item=>!item.weekday);
        const weekdays=g.items.filter(item=>item.weekday);
        return `<section class="group">${heading}<div class="chips">${regular.map(x=>phrase(x,g.kind)).join('')}</div><div class="weekday-row" aria-label="Veckodagar">${weekdays.map(x=>phrase(x,g.kind)).join('')}</div></section>`;
      }
      if(g.kind==='connector'){
        return `<section class="group connector-group">${heading}<div class="connector-row">${g.items.map(x=>phrase(x,g.kind)).join('')}</div></section>`;
      }
      if(g.kind==='activity')return `<section class="group">${heading}<div class="activity-grid">${g.items.map(x=>phrase(x,g.kind)).join('')}</div></section>`;
      if(g.kind==='certainty')return `<section class="group">${heading}<div class="certainty-labels" lang="${state.lang}"><span>${labels.certain[state.lang]}</span><span>${labels.uncertain[state.lang]}</span></div><div class="certainty">${g.items.map((x,i)=>`<div class="certainty-row ${x.level==='advanced'?'advanced':''}" data-level="${x.level}" style="--i:${i}"><i></i>${phrase(x,'')}</div>`).join('')}</div></section>`;
      return `<section class="group">${heading}<div class="chips">${g.items.map(x=>phrase(x,g.kind)).join('')}</div></section>`;
    }).join('');
    document.getElementById(key+'Panel').innerHTML=`<header class="panel-title"><span class="panel-icon">${icon(key)}</span><div lang="${state.lang}"><h2 id="${key}Title">${d.title[state.lang]}</h2><p>${d.subtitle[state.lang]}</p></div></header>${renderPathways(key)}<div class="groups">${groups}</div>`;
  }
  function render(){const ui=content.interfaceText,labels=ui.uiLabels;document.documentElement.classList.toggle('translations-hidden',!state.translations);document.documentElement.classList.toggle('extended',state.view==='extended');document.getElementById('language').value=state.lang;document.getElementById('eyebrowText').textContent=labels.conversationMap[state.lang];document.getElementById('eyebrowText').lang=state.lang;document.getElementById('mainTitle').textContent=ui.mainTitle[state.lang];document.getElementById('mainTitle').lang=state.lang;document.getElementById('subtitleText').textContent=ui.subtitle[state.lang];document.getElementById('subtitleText').lang=state.lang;document.title=ui.mainTitle[state.lang];document.getElementById('toggleTranslations').textContent=(state.translations?ui.hide:ui.show)[state.lang];document.getElementById('toggleTranslations').setAttribute('aria-pressed',String(!state.translations));document.querySelectorAll('[data-view]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.view===state.view));b.textContent=labels[b.dataset.view][state.lang]});document.getElementById('pastTab').innerHTML=`<span aria-hidden="true">←</span>${labels.tabs.past[state.lang]}`;document.getElementById('futureTab').innerHTML=`${labels.tabs.future[state.lang]}<span aria-hidden="true">→</span>`;renderPanel('past');renderPanel('future')}
  function setPerspective(perspective,moveFocus=false){state.perspective=perspective;localStorage.setItem('conversation-perspective',perspective);document.body.classList.toggle('perspective-past',perspective==='past');document.body.classList.toggle('perspective-future',perspective==='future');document.querySelectorAll('.perspective-tab').forEach(tab=>{const active=tab.dataset.perspective===perspective;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;if(active&&moveFocus)tab.focus()});document.getElementById('pastPanel').hidden=perspective!=='past';document.getElementById('futurePanel').hidden=perspective!=='future'}
  document.getElementById('language').addEventListener('change',e=>{state.lang=e.target.value;localStorage.setItem('conversation-lang',state.lang);render()});
  document.getElementById('toggleTranslations').addEventListener('click',()=>{state.translations=!state.translations;localStorage.setItem('conversation-translations',state.translations?'shown':'hidden');render()});
  document.querySelector('.perspective-tabs').addEventListener('click',e=>{const tab=e.target.closest('.perspective-tab');if(tab)setPerspective(tab.dataset.perspective)});
  document.querySelector('.perspective-tabs').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();setPerspective(e.key==='ArrowLeft'||e.key==='Home'?'past':'future',true)});
  render();setPerspective(state.perspective);
  </script>
</body>
