 .gl::before,.gl::after{position:absolute;left:50%;pointer-events:none;opacity:0;transition:opacity .22s ease,transform .22s ease;z-index:5}

 .gl::before{content:"";bottom:calc(100% + 3px);transform:translate(-50%,4px);border:6px solid transparent;border-top-color:#111;border-bottom:0}

 .gl:hover::before,.gl:hover::after,.gl:focus-visible::before,.gl:focus-visible::after{opacity:1;transform:translate(-50%,0);transition-delay:.15s}
}

.bar label.tog{gap:8px;user-select:none}

.bar #q,.bar button,.bar label{min-height:44px;box-sizing:border-box}

}

<script>
const D=[
[1, "Johanna har just börjat springa och vill träna varje dag. En vän tipsar henne om att vila ibland.", "Allt med måtta.", "Man ska undvika överdrifter.", [], 0, 172, ["Lagom är bäst."]],
[2, "Bodil undrar varför hennes dotter tar fram mobilen vid middagen. Bodils syster tittar på mobilen som Bodil själv håller i handen.", "Barn gör som du gör, inte som du säger.", "Barn tar efter vuxnas handlingar snarare än deras ord.", [], 0, 198, ["Äpplet faller inte långt från trädet.", "Lev som du lär."]],
[3, "Anton vill lägga ut en pinsam bild på en kompis. Hans pappa frågar hur Anton skulle känna om kompisen gjorde samma sak mot honom.", "Behandla andra så som du själv vill bli behandlad.", "Den gyllene regeln.", [], 0, 62],
[4, "Efter två fina veckor i Italien kommer Anna hem. Hon tar av sig skorna och sjunker ner i sin egen soffa.", "Borta bra men hemma bäst.", "Det är roligt att resa, men inget slår att komma hem.", [], 0, 22, ["Mitt hem är min borg."]],
[5, "En vän ringer och säger grattis tre dagar efter Sofias födelsedag. Sofia skrattar och säger att hon är glad att han ringde.", "Bättre sent än aldrig.", "Bättre att något blir gjort sent än inte alls.", [], 0, 2, ["Sent ska syndaren vakna."]],
[6, "Den nya soffan är äntligen på plats. ”Hur får vi ut den om vi flyttar?” frågar Nils. ”Det tar vi då”, säger Ella och sätter sig.", "Den dagen, den sorgen.", "Oroa dig inte för något förrän det händer.", [], 0, 68],
[7, "Efter första kvällen med kören frågar en vän om Maja tror att hon fortfarande sjunger där om ett år. Maja ler och rycker på axlarna.", "Den som lever får se.", "Framtiden får utvisa.", [], 0, 5, ["Osvuret är bäst."]],
[8, "Maria frågar för tredje gången när bullarna är klara. Till slut får hon smaka en varm bulle och ler med hela munnen.", "Den som väntar på något gott väntar aldrig för länge.", "Det lönar sig att ha tålamod.", [], 0, 10],
[9, "På sitt nya jobb vill Måns fråga var alla äter lunch. Han tycker att frågan är lite fånig, men en kollega säger att det är bra att han frågar.", "Det finns inga dumma frågor.", "Man ska inte skämmas för att fråga.", [], 0, 131],
[10, "Det regnar och Mattias vill ställa in promenaden. Sara tar fram två regnjackor och räcker honom den ena.", "Det finns inget dåligt väder, bara dåliga kläder.", "Klä dig rätt, så kan du vara ute i alla väder.", [], 0, 34],
[11, "Bilen står stilla i en lång kö. ”Vi skulle ha tagit den andra vägen”, säger en av vännerna. När de körde förbi den såg vägen framför dem helt fri ut.", "Det är lätt att vara efterklok.", "Det är lätt att veta vad som var rätt i efterhand.", [], 0, 23],
[12, "Eva råkar boka ett möte klockan tre på natten. När hon ber om ursäkt berättar en kollega om mötet han själv bokade på julafton.", "Det är mänskligt att fela.", "Alla gör misstag.", [], 0, 97],
[13, "Linnea ger sin morfar en skål som hon gjort för hans nycklar. Hon tycker att skålen är lite sned. Men morfar blir jätteglad, för att Linnea har tänkt på honom.", "Det är tanken som räknas.", "Avsikten bakom en gåva är viktigare än gåvan.", [], 0, 42],
[14, "Efter månader av nej får Pernilla äntligen jobbet hon ville ha. Hon ringer en vän som har stöttat henne och berättar den goda nyheten.", "Efter regn kommer solsken.", "Efter svåra tider kommer bättre.", [], 0, 55, ["Delad glädje är dubbel glädje.", "Trägen vinner."]],
[15, "Cecilia försöker beskriva en fågel hon såg i trädgården. Stefan gissar först på en kråka, sedan på en koltrast. Till slut visar Cecilia ett foto. ”Jaha, en skata!” säger Stefan direkt.", "En bild säger mer än tusen ord.", "En bild kan förmedla mer än en lång beskrivning.", [], 0, 28],
[16, "Tre personer vill ha fåtöljen som Lisa ger bort. Hon säger att den som kommer först får ta den.", "Först till kvarn får först mala.", "Den som kommer först får först.", [], 0, 4],
[17, "Elin önskar att hon kunde välja sina arbetstider själv, som hennes vän gör. Vännen suckar och säger att hon gärna skulle ha Elins fasta lön.", "Gräset är alltid grönare på andra sidan.", "Man tror att andra har det bättre.", [], 0, 100],
[18, "Vid bilen blir Anette osäker på om hon har släckt ljusen. ”Jag tror det, men vi går upp och tittar”, säger Adrian och tar fram nyckeln.", "Hellre en gång för mycket än en gång för lite.", "Det är bättre att vara överförsiktig.", [], 0, 182],
[19, "Underläge med två mål, tre minuter kvar av fotbollsmatchen. ”Så tråkigt, kom så åker vi hem”, säger Peter. David sitter kvar. ”Nej, jag stannar. Vi kan fortfarande vinna.”", "Hoppet är det sista som överger människan.", "Man slutar aldrig hoppas.", [], 0, 31, ["Så länge det finns liv finns det hopp.", "Skam den som ger sig."]],
[20, "Det går rykten om att kaféet ska säljas. Elisabet tror att det bara är prat, men Joakim har sett ägaren visa runt två personer som vill köpa det.", "Ingen rök utan eld.", "Rykten har oftast någon grund.", [], 0, 12],
[21, "I dagens tidning klagar en läsare på att unga visar för lite respekt för äldre. På biblioteket hittar Pia samma klagomål i en hundra år gammal tidning.", "Inget nytt under solen.", "(Även <i>Intet nytt...<\/i>) Allt har hänt förut.", [], 0, 6],
[22, "Fem personer har ändrat i samma inbjudan. Nu står det lördag högst upp och söndag längst ner.", "Ju fler kockar, desto sämre soppa.", "För många inblandade förstör resultatet.", [], 0, 98],
[23, "En gäst hör Elsa ropa ”Smulan!” och sedan ”Lilltrollet!” Han undrar hur många katter hon har. Elsa skrattar och pekar på den enda katten.", "Kärt barn har många namn.", "Det man tycker om kallas gärna många saker.", [], 0, 20],
[24, "På festen är musiken så hög att gästerna måste ropa. Värden sänker ljudet tills alla kan prata och ändå höra musiken.", "Lagom är bäst.", "Varken för mycket eller för lite.", [], 0, 32, ["Allt med måtta."]],
[25, "Chefen säger att alla ska vara lediga på helgen. På söndagen mejlar hon ändå och måndag morgon undrar hon varför ingen har svarat på mejlet.", "Lev som du lär.", "Handla i enlighet med det du förkunnar.", [], 0, 117],
[26, "Max köper det billigaste paraplyet i butiken. Redan vid första vindpusten går det sönder.", "Man får vad man betalar för.", "Billiga saker håller ofta sämre kvalitet.", [], 0, 44],
[27, "Per vill sälja sommarstugan men ändå fira midsommar där varje år. Hans syster undrar var de nya ägarna ska vara då.", "Man kan inte både äta kakan och ha den kvar.", "Man kan inte få allt.", [], 0, 25],
[28, "Ebbas favoritband spelar i stan och det finns en biljett kvar. Den är dyr, men hon har drömt om konserten i flera år. Hon köper biljetten.", "Man lever bara en gång.", "Passa på att njuta av livet.", [], 0, 47],
[29, "Åsa har sytt i sextio år. En kväll visar en vän henne ett knep som gör det lättare att få tråden genom nålen.", "Man lär så länge man lever.", "Man slutar aldrig lära sig nya saker.", [], 0, 54],
[30, "På ett möte klagar kassören på att folk lämnar in sina kvitton för sent. En annan i föreningen undrar när kassören tänker lämna in sina egna.", "Man ska inte kasta sten i glashus.", "Kritisera inte andra för fel du själv har.", [], 0, 7, ["Lev som du lär."]],
[31, "En köpare har lagt ett bra bud och Nora vill öppna champagnen. Mäklaren föreslår att de väntar tills köparen har skrivit på.", "Man ska inte ropa hej förrän man är över bäcken.", "Jubla inte förrän något verkligen är klart.", [], 0, 102, ["Man ska inte sälja skinnet förrän björnen är skjuten."]],
[32, "Tove kan få högre lön på ett nytt jobb. Hon tvekar. På jobbet hon har nu trivs hon och vet att chefen lyssnar på henne.", "Man vet vad man har men inte vad man får.", "Det kända kan vara säkrare än något nytt.", [], 0, 164, ["Bättre en fågel i handen än tio i skogen."]],
[33, "I byns butik lägger kunderna några kronor var i en burk. När sommaren är slut räcker pengarna till att laga bryggan.", "Många bäckar små.", "Små bidrag blir tillsammans mycket. Längre form fortsätter: <i>gör/blir en stor å<\/i>.", [], 0, 16],
[34, "Wilmer vill ha nya fotbollsskor fast paret han har nästan är nytt. Hans pappa frågar om det verkligen är värt att köpa nya skor bara för färgens skull.", "Pengar växer inte på träd.", "Pengar måste förtjänas, var sparsam.", [], 0, 173],
[35, "Efter en hel helg i trädgården har Bodil bara hunnit plantera några blommor. Grannen visar sina rosor och berättar att det tagit honom tio år att få trädgården så fin.", "Rom byggdes inte på en dag.", "Stora saker tar tid.", [], 0, 85],
[36, "Efter frågesporten ser det vinnande laget att de fått en poäng för mycket. De säger till, fast de vet att det andra laget då vinner.", "Rätt ska vara rätt.", "Det som är rättvist ska gälla.", [], 0, 3, ["Ärlighet varar längst."]],
[37, "Två gånger har kommunen sagt nej till ett övergångsställe vid skolan. På nästa möte tar en förälder fram en ny ansökan.", "Skam den som ger sig.", "Ge inte upp.", [], 0, 11, ["Trägen vinner.", "Droppen urholkar stenen."]],
[38, "Flyttbilen väntar och Markus lägger snabbt ner alla glas i en låda. Elisabet räcker honom lite papper. ”Vi hinner slå in dem så att de håller.”", "Skynda långsamt.", "Gör det noggrant, så går det fortare i längden.", [], 0, 37],
[39, "Strax före bröllopet upptäcker brudparet att ringarna ligger hemma. Brudens bror cyklar och hämtar dem. Vid middagen skrattar alla åt hur fort han cyklade.", "Slutet gott, allting gott.", "Slutar det bra spelar svårigheterna mindre roll.", [], 0, 27],
[40, "Två vänner ser en orange fåtölj med lila fransar. ”Vem skulle vilja ha den?” säger den ena. Den andra tar fram plånboken.", "Smaken är som baken, delad.", "Människor tycker olika.", [], 0, 1, ["Skönhet sitter i betraktarens öga."]],

// Engelska och ursprung (ur databasen). X[ordspråk]=[engelska, närmaste motsvarighet, ordagrann översättning 1/0, ursprung]
function extra(o,q){const x=X[o];if(!x)return'';const [en,near,tr,src]=x;let s='';
 if(en||near)s+='<div class="xi"><span class="xl">English:</span> '+(en?(tr?'<span class="xn">lit.</span> ':'')+'<i>'+hl(en,q)+'</i>'+(near?' ':''):'')+(near?'<span class="xn">Closest:</span> <i>'+hl(near,q)+'</i>':'')+'</div>';
 s+='<div class="xi"><span class="xl">Ursprung:</span> '+hl(src||'Okänt',q)+'</div>';return s}
const XS=o=>(X[o]||[]).join(' ')+(X[o]&&!X[o][3]?' Okänt':'');
const SB=document.getElementById('sort');
// Ny slumpvis ordning vid varje sidladdning och varje gång man väljer slumpvis; knappen växlar till ordning efter ranking (#1 = vanligast i Korp).
let RANDOM;function shuffle(){RANDOM=D.slice();for(let i=RANDOM.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[RANDOM[i],RANDOM[j]]=[RANDOM[j],RANDOM[i]];}}
shuffle();
const RANKED=D.slice().sort((a,b)=>a[6]-b[6]);
let byRank=false;
// Fält 8 (valfritt): närliggande varianter, visas under "Närliggande variant" (sorteras efter ranking). Varje post är antingen bara texten, "Ordspråk.", eller ["Ordspråk.", "Kommentar"].
const RK=Object.fromEntries(D.map(x=>[x[2],x[6]]));
const L=document.getElementById('list'),Q=document.getElementById('q'),C=document.getElementById('count'),B=document.getElementById('all');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let allOpen=false;
function hl(s,q){s=esc(s);if(!q)return s;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');return s.replace(re,m=>'<mark>'+m+'</mark>')}
function render(){
 const q=Q.value.trim().toLowerCase();let n=0;L.innerHTML='';
 for(const [nr,scen0,ord,forkl,alts,saknas,rk,pass=[]] of (byRank?RANKED:RANDOM)){
  const scen=saknas?'⚠ SCEN SAKNAS: '+ord:scen0;
  const P=pass.map(x=>Array.isArray(x)?x:[x,'']);
  const hay=(scen+' '+ord+' '+XS(ord)+' '+alts.flat().join(' ')+' '+P.flat().join(' ')).toLowerCase();
  if(q&&!hay.includes(q))continue;n++;
  const li=document.createElement('li');li.className='s'+(allOpen?' open':'')+(saknas?' miss':'');
  const showA=allOpen||(q&&(ord+' '+XS(ord)+' '+alts.flat().join(' ')+P.flat().join(' ')).toLowerCase().includes(q));
  li.innerHTML='<button aria-expanded="'+showA+'"><span class="n" title="Plats '+rk+' bland ordspråken (kort nr '+nr+')">#'+rk+'</span><span class="t">'+hl(scen,q)+'</span><span class="chev"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>'+
  '<div class="a"'+(showA?'':' hidden')+'><div class="main"><div class="lab">Ordspråket</div><div class="p"><a class="gl" href="'+gq(ord)+'" target="_blank" rel="noopener" data-tip="Sök exakt på Google (öppnas i ny flik)" aria-label="'+esc(ord)+' – sök exakt på Google (öppnas i ny flik)">'+hl(ord,q)+'<svg class="ext" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M9 2.5h4.5V7M13.3 2.7 7.5 8.5M12 9.5V13a.5.5 0 0 1-.5.5H3a.5.5 0 0 1-.5-.5V4.5A.5.5 0 0 1 3 4h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div><div class="d">'+forkl+'</div>'+extra(ord,q)+'</div>'+
  (P.length?'<div class="syn"><div class="lab">Närliggande variant'+(P.length>1?'er':'')+'</div>'+P.slice().sort((x,y)=>(RK[x[0]]||1e9)-(RK[y[0]]||1e9)).map(([t,c])=>'<div class="p">'+hl(t,q)+'<button type="button" class="nvb" data-o="'+esc(t)+'" aria-label="Visa mer om '+esc(t)+'" title="Visa scen och mer"><svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="10" cy="10" r="8.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8.2 6.6 11.8 10l-3.6 3.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>'+(c?'<div class="pnote">'+c+'</div>':'')+'</div>').join('')+'</div>':'')+
  (alts.length?'<div class="alts"><div class="lab">Hade man kunnat säga?</div>'+alts.map(a=>{const [t,n]=Array.isArray(a)?a:[a,''];return '<div class="p">'+hl(t,q)+(n?'<div class="note">'+n+'</div>':'')+'</div>'}).join('')+'</div>':'')+'</div>';
  if(showA)li.classList.add('open');
  li.firstChild.onclick=()=>toggleCard(li);
  L.appendChild(li);
 }
 const miss=D.filter(x=>x[5]).length;
 C.textContent=n+' av '+D.length+' scener'+(miss?' · '+miss+' saknar scen':'');
}
Q.oninput=render;
function paintTog(){document.getElementById('tlR').classList.toggle('on',!byRank);document.getElementById('tlK').classList.toggle('on',byRank)}
SB.checked=false;paintTog();
SB.onchange=()=>{byRank=SB.checked;if(!byRank)shuffle();paintTog();render()};
B.onclick=()=>{allOpen=!allOpen;B.textContent=allOpen?'Dölj alla':'Visa alla';render()};
render();

// Ett kort öppet i taget (utom vid "Visa alla" och sökning); håll det klickade kortet still
function setOpen(li,o){const a=li.querySelector('.a');a.hidden=!o;li.classList.toggle('open',o);li.firstChild.setAttribute('aria-expanded',o)}
function toggleCard(li){
 const opening=li.querySelector('.a').hidden;
 if(!opening){setOpen(li,false);return}
 const before=li.getBoundingClientRect().top;
 if(!allOpen&&!Q.value.trim())document.querySelectorAll('#list .s.open, .s.open').forEach(o=>{if(o!==li)setOpen(o,false)});
 const shift=li.getBoundingClientRect().top-before;
 if(shift)window.scrollBy(0,shift);
 setOpen(li,true);
 const r=li.getBoundingClientRect(),over=r.bottom-(window.innerHeight-16);
 if(over>0)window.scrollBy({top:Math.min(over,r.top-16),behavior:'smooth'});
}
// Modal för närliggande varianter
const XN={"Även en trasig klocka visar rätt två gånger om dagen.":["Även den som brukar ha fel har ibland rätt.","Even a stopped clock is right twice a day.","",0,""]};
const MD=document.getElementById('md'),MDI=document.getElementById('mdi');
function openMd(o){
 const e=D.find(x=>x[2]===o);let forkl,scen,en,near,tr,src;
 if(e){forkl=e[3];scen=e[1];[en,near,tr,src]=X[o]||[]}else{const n=XN[o]||[];[forkl,en,near,tr,src]=n;scen=''}
 let s='<h2 id="mdt">'+esc(o)+'</h2>'+(forkl?'<div class="d">'+forkl+'</div>':'');
 if(en||near)s+='<div class="xi"><span class="xl">English:</span> '+(en?(tr?'<span class="xn">lit.</span> ':'')+'<i>'+esc(en)+'</i>'+(near?' ':''):'')+(near?'<span class="xn">Closest:</span> <i>'+esc(near)+'</i>':'')+'</div>';
 s+='<div class="xi"><span class="xl">Ursprung:</span> '+esc(src||'Okänt')+'</div>';
 if(scen)s+='<div class="main sc"><div class="lab">Scen</div><div class="scen">'+esc(scen)+'</div></div>';
 MDI.innerHTML=s;MDI.scrollTop=0;MD.showModal();
}
document.addEventListener('click',ev=>{const b=ev.target.closest('.nvb');if(b){ev.preventDefault();ev.stopPropagation();openMd(b.dataset.o)}});
document.getElementById('mdx').onclick=()=>MD.close();
MD.addEventListener('click',ev=>{if(ev.target===MD)MD.close()});
</script>
