<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ihop!</title>
<style>
  :root{
    --bg1:#fff8e8;
    --bg2:#eef9ff;
    --card:#ffffff;
    --shadow:0 8px 20px rgba(35,55,75,.13);
  }

  *{box-sizing:border-box}
  html,body{min-height:100%;margin:0}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:
      radial-gradient(circle at 10% 12%, #ffe6ef 0 9%, transparent 10%),
      radial-gradient(circle at 90% 18%, #e9f7d8 0 8%, transparent 9%),
      linear-gradient(145deg,var(--bg1),var(--bg2));
    overflow-x:hidden;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
  }

  .game{
    width:min(920px,100%);
    min-height:100vh;
    margin:auto;
    padding:clamp(16px,3vw,32px);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .board{
    width:100%;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:clamp(14px,3vw,34px);
    align-items:start;
  }

  .column{
    display:grid;
    grid-template-columns:1fr;
    gap:clamp(10px,1.8vw,17px);
  }

  .item{
    height:clamp(74px,10.5vh,104px);
    border:0;
    border-radius:26px;
    background:rgba(255,255,255,.95);
    box-shadow:var(--shadow);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    position:relative;
    font-size:clamp(42px,7vw,66px);
    line-height:1;
    -webkit-tap-highlight-color:transparent;
    transition:transform .18s ease, box-shadow .18s ease, background .25s ease;
  }

  .item:hover{transform:scale(1.025)}
  .item:active{cursor:grabbing}
  .item.drag-source{
    transform:scale(.95);
    box-shadow:0 4px 12px rgba(35,55,75,.12);
  }

  .item.drop-ready{
    transform:scale(1.08);
    box-shadow:0 0 0 7px rgba(97,199,122,.24), var(--shadow);
  }

  .item.wrong{animation:shake .32s ease}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-9px)}
    75%{transform:translateX(9px)}
  }

  .item.matched{
    pointer-events:none;
    background:#fff8c7;
    animation:starPop .6s cubic-bezier(.2,1.4,.4,1);
  }

  .item.matched .picture{display:none}
  .item.matched::after{
    content:"⭐";
    font-size:clamp(48px,8vw,72px);
    filter:drop-shadow(0 4px 4px rgba(0,0,0,.12));
  }

  @keyframes starPop{
    0%{transform:scale(.75) rotate(-8deg)}
    55%{transform:scale(1.18) rotate(7deg)}
    100%{transform:scale(1) rotate(0)}
  }

  .picture{
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }

  .picture svg{
    width:clamp(58px,8vw,82px);
    height:clamp(58px,8vw,82px);
    display:block;
  }

  .drag-ghost{
    position:fixed;
    z-index:50;
    width:clamp(76px,11vw,108px);
    height:clamp(76px,11vw,108px);
    transform:translate(-50%,-50%) scale(1.08);
    border-radius:28px;
    background:#fff;
    box-shadow:0 14px 35px rgba(35,55,75,.24);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(45px,7vw,68px);
    pointer-events:none;
    opacity:.96;
  }

  .drag-ghost svg{
    width:70%;
    height:70%;
  }

  .celebration{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    background:rgba(255,251,226,.94);
    backdrop-filter:blur(5px);
    animation:fadeIn .35s ease;
  }

  .celebration.show{display:flex}

  .great{
    margin:0;
    font-size:clamp(48px,11vw,104px);
    font-weight:1000;
    letter-spacing:.02em;
    color:#1f7a42;
    text-shadow:0 4px 0 #fff;
    animation:bounceIn .8s cubic-bezier(.2,1.5,.4,1);
  }

  .thumb{
    margin-top:20px;
    font-size:clamp(90px,20vw,180px);
    animation:thumb .9s .18s both cubic-bezier(.2,1.5,.4,1);
    filter:drop-shadow(0 10px 8px rgba(0,0,0,.12));
  }

  .spark{
    position:absolute;
    font-size:clamp(26px,5vw,52px);
    animation:float 2.5s ease-in-out infinite alternate;
  }
  .s1{left:9%;top:14%;animation-delay:.1s}
  .s2{right:10%;top:20%;animation-delay:.5s}
  .s3{left:16%;bottom:12%;animation-delay:.9s}
  .s4{right:15%;bottom:14%;animation-delay:.25s}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes bounceIn{
    from{transform:scale(.35);opacity:0}
    65%{transform:scale(1.12);opacity:1}
    to{transform:scale(1)}
  }
  @keyframes thumb{
    from{transform:scale(.2) rotate(-18deg);opacity:0}
    70%{transform:scale(1.15) rotate(7deg);opacity:1}
    to{transform:scale(1) rotate(0)}
  }
  @keyframes float{
    from{transform:translateY(-8px) rotate(-8deg)}
    to{transform:translateY(10px) rotate(9deg)}
  }

  @media (max-height:650px) and (orientation:landscape){
    .game{padding:12px}
    .column{grid-template-columns:repeat(2,1fr);gap:9px}
    .board{gap:18px}
    .item{height:72px;border-radius:20px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<main class="game" aria-label="Para ihop bilderna">
  <section class="board" id="board">
    <div class="column" aria-label="Vänster sida">
      <button class="item" data-pair="cat" aria-label="Katt"><span class="picture">🐱</span></button>
      <button class="item" data-pair="dog" aria-label="Hund"><span class="picture">🐶</span></button>
      <button class="item" data-pair="wasp" aria-label="Geting">
        <span class="picture">
          <svg viewBox="0 0 120 90" aria-hidden="true">
            <ellipse cx="43" cy="31" rx="24" ry="15" fill="#dff4ff" stroke="#98c7db" stroke-width="4" transform="rotate(-22 43 31)"/>
            <ellipse cx="78" cy="29" rx="24" ry="15" fill="#dff4ff" stroke="#98c7db" stroke-width="4" transform="rotate(22 78 29)"/>
            <ellipse cx="61" cy="52" rx="34" ry="22" fill="#f6c928" stroke="#3b3324" stroke-width="5"/>
            <path d="M43 38l-8 25M59 31l-7 39M77 34l-5 31" stroke="#3b3324" stroke-width="8"/>
            <circle cx="92" cy="49" r="13" fill="#3b3324"/>
            <circle cx="97" cy="45" r="3" fill="#fff"/>
            <path d="M26 52H13" stroke="#3b3324" stroke-width="5" stroke-linecap="round"/>
          </svg>
        </span>
      </button>
      <button class="item" data-pair="horse" aria-label="Häst"><span class="picture">🐴</span></button>
      <button class="item" data-pair="fish" aria-label="Fisk"><span class="picture">🐟</span></button>
      <button class="item" data-pair="spider" aria-label="Spindel"><span class="picture">🕷️</span></button>
      <button class="item" data-pair="rabbit" aria-label="Kanin"><span class="picture">🐰</span></button>
    </div>

    <div class="column" aria-label="Höger sida">
      <button class="item" data-pair="spider" aria-label="Spindelnät"><span class="picture">🕸️</span></button>
      <button class="item" data-pair="horse" aria-label="Ridhjälm">
        <span class="picture">
          <svg viewBox="0 0 120 100" aria-hidden="true">
            <path d="M25 58c0-29 18-47 43-47 25 0 42 19 42 47v8H25z" fill="#6e62b5" stroke="#403875" stroke-width="5"/>
            <path d="M25 65h83c-6 13-18 20-35 20H35c-8 0-15-6-15-13 0-4 2-6 5-7z" fill="#514795" stroke="#403875" stroke-width="5"/>
            <path d="M73 84c0 9 5 13 14 13" fill="none" stroke="#403875" stroke-width="5" stroke-linecap="round"/>
            <path d="M64 13v48" stroke="#8e85cf" stroke-width="4" opacity=".9"/>
          </svg>
        </span>
      </button>
      <button class="item" data-pair="cat" aria-label="Mus"><span class="picture">🐭</span></button>
      <button class="item" data-pair="rabbit" aria-label="Morot"><span class="picture">🥕</span></button>
      <button class="item" data-pair="wasp" aria-label="Blomma"><span class="picture">🌼</span></button>
      <button class="item" data-pair="dog" aria-label="Hundben"><span class="picture">🦴</span></button>
      <button class="item" data-pair="fish" aria-label="Fiskspö"><span class="picture">🎣</span></button>
    </div>
  </section>
</main>

<div class="celebration" id="celebration" role="status" aria-live="polite">
  <div class="spark s1">⭐</div>
  <div class="spark s2">⭐</div>
  <div class="spark s3">⭐</div>
  <div class="spark s4">⭐</div>
  <h1 class="great">BRA JOBBAT!</h1>
  <div class="thumb" aria-hidden="true">👍</div>
</div>

<script>
(() => {
  const items = [...document.querySelectorAll('.item')];
  const celebration = document.getElementById('celebration');
  let active = null;
  let ghost = null;
  let hoverTarget = null;
  let matchedPairs = 0;

  function makeGhost(source, x, y){
    ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.innerHTML = source.innerHTML;
    ghost.style.left = x + 'px';
    ghost.style.top = y + 'px';
    document.body.appendChild(ghost);
  }

  function setHover(target){
    if (hoverTarget && hoverTarget !== target) hoverTarget.classList.remove('drop-ready');
    hoverTarget = target;
    if (hoverTarget) hoverTarget.classList.add('drop-ready');
  }

  function targetAt(x, y){
    const el = document.elementFromPoint(x, y);
    const target = el && el.closest('.item');
    if (!target || target === active || target.classList.contains('matched')) return null;
    return target;
  }

  function correctMatch(a,b){
    return a.dataset.pair === b.dataset.pair;
  }

  function match(a,b){
    [a,b].forEach(el => {
      el.classList.remove('drag-source','drop-ready');
      el.classList.add('matched');
    });
    matchedPairs++;
    playTone(660, .08);
    setTimeout(() => playTone(880, .1), 90);

    if (matchedPairs === 7){
      setTimeout(() => {
        celebration.classList.add('show');
        playFinish();
      }, 650);
    }
  }

  function wrong(a,b){
    a.classList.add('wrong');
    if (b) b.classList.add('wrong');
    setTimeout(() => {
      a.classList.remove('wrong');
      if (b) b.classList.remove('wrong');
    }, 360);
  }

  function cleanup(){
    if (hoverTarget) hoverTarget.classList.remove('drop-ready');
    if (active) active.classList.remove('drag-source');
    if (ghost) ghost.remove();
    active = null;
    ghost = null;
    hoverTarget = null;
  }

  function onPointerDown(e){
    const item = e.currentTarget;
    if (item.classList.contains('matched')) return;
    e.preventDefault();
    active = item;
    item.classList.add('drag-source');
    item.setPointerCapture?.(e.pointerId);
    makeGhost(item, e.clientX, e.clientY);
  }

  function onPointerMove(e){
    if (!active || !ghost) return;
    e.preventDefault();
    ghost.style.left = e.clientX + 'px';
    ghost.style.top = e.clientY + 'px';
    setHover(targetAt(e.clientX, e.clientY));
  }

  function onPointerUp(e){
    if (!active) return;
    e.preventDefault();
    const source = active;
    const target = targetAt(e.clientX, e.clientY);
    if (target && correctMatch(source,target)) match(source,target);
    else if (target) wrong(source,target);
    cleanup();
  }

  items.forEach(item => {
    item.addEventListener('pointerdown', onPointerDown);
    item.addEventListener('pointermove', onPointerMove);
    item.addEventListener('pointerup', onPointerUp);
    item.addEventListener('pointercancel', cleanup);
  });

  // Very short positive sounds, generated locally. The game also works silently.
  let audioCtx;
  function ctx(){
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }
  function playTone(freq, duration){
    try{
      const c = ctx();
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(.05,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+duration);
    }catch(_){}
  }
  function playFinish(){
    [523,659,784,1047].forEach((f,i)=>setTimeout(()=>playTone(f,.18),i*120));
  }
})();
</script>
</body>
</html>
